packages:
  - packages/*
  - capabilities/*
  - scripts

catalog:
  vitest: 5.0.3
  '@vitest/coverage-v8': 5.0.3
  effect: 4.0.0
  hono: 4.13.13
  jose: 6.2.12

minimumReleaseAge: 10080
minimumReleaseAgeStrict: false
minimumReleaseAgeExclude:
  - effect@4.0.0
trustPolicy: no-downgrade
blockExoticSubdeps: true

allowBuilds:
  esbuild: true
  lefthook: true
  protobufjs: false
  sqlite3: true

patchedDependencies:
  '@event-driven-io/dumbo@0.13.0-beta.56': patches/@event-driven-io__dumbo@0.13.0-beta.56.patch
  '@openworkflowspec/sdk@1.0.3-alpha8': patches/@openworkflowspec__sdk@1.0.3-alpha8.patch

overrides:
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'undici@>=6.0.0 <6.29.1': 6.29.1
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'zod@>=4.0.0 <4.6.7': 4.6.7
