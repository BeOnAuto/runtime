  """
  list_org_changes(
    """
    The cursor of the answer before; left out, the answer holds the cursor of now and no changes
    """
    since: String

    """
    How many seconds, 0 to 25, the runtime holds the request while nothing changed; 25 when left out
    """
    wait: Float

    """
    What the changes are of: org, the org's own resources, when left out; org_and_playbooks, those and everything inside each playbook of the org the caller may read, each change of a playbook naming its playbook
    """
    scope: String
  ): ListOrgChangesAnswer

