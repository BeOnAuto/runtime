  """
  list_playbooks(
    """Whether to list retired playbooks as well; false when left out"""
    include_retired: Boolean
  ): ListPlaybooksAnswer

  """
  Reads one playbook by its id, active or retired, with its goals, what they still lack and the source of its page. Use it to read the playbook's goals or page, or a playbook whose id is known; list_playbooks finds the others. `goals.gaps` says what to ask the person or put right, and a playbook with no goals needs them before a workflow is saved in it. `playbook` is its id.
  """
  get_playbook(
    """
    The id of the playbook: 3 to 48 lowercase letters, digits and hyphens, starting with a letter
    """
    playbook: String!
  ): PlaybookWithGoals

