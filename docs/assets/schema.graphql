  org: String

  """
  The name of that org, as Auto signed it into the license, or null where it named none
  """
  org_name: String

  """The plan of that org"""
  plan: String

  """
  The features of the license in force, which work that needs one checks before it starts; none without a license, or once it is invalid or lapsed
  """
  features: [String!]!

  """Where the credits of its org stood when Auto signed the license"""
  standing: String

  """The runs it has started on a license, in all"""
  licensed: Float!

  """The runs it may still start on its license, and null without one"""
  runs_left: Float

  """The credits of its org when Auto signed the license"""
  credits: GetLicenseAnswerCredits

  """When Auto signed the license"""
  issued_at: String

  """
  From when Auto warns that the runtime is out of touch, unless it reports first
  """
  warn_at: String

  """From when it runs at the free rate, unless it reports first"""
