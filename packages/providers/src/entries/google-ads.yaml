name: google-ads
title: Google Ads
description: Query Google Ads accounts with its query language, list the customers and report fields you can reach, and create or change campaign budgets, campaigns, ad groups and ad group criteria such as keywords.
summary: Lets your playbooks report on Google Ads accounts and change campaigns, budgets and ad groups.
website: https://developers.google.com/google-ads/api/docs/get-started/introduction
icons:
  - src: icons/google-ads.svg
type: openapi
document: documents/google-ads.openapi.json
headers:
  login-customer-id: '{manager_id}'
marks:
  reads:
    - googleads.customers.googleAds.search
    - googleads.customers.googleAds.searchStream
    - googleads.googleAdsFields.search
placeholders:
  manager_id:
    title: Manager account customer ID
    description: 'The customer ID of the manager account you reach the account through, if you use one: ten digits, without hyphens.'
    pattern: '^[0-9]{10}$'
    example: '1234567890'
    required: false
credentials:
  - kind: authorization
    account_types: [personal]
    issuer: https://accounts.google.com
    scope: https://www.googleapis.com/auth/adwords
    says:
      https://www.googleapis.com/auth/adwords: See, create, change and delete Google Ads accounts and data.
    parameters:
      access_type: offline
      prompt: consent
    clients: [registered]
    description: Sign in to Google and allow Google Ads.
  - kind: jwt_bearer
    issuer: https://accounts.google.com
    scope: https://www.googleapis.com/auth/adwords
    says:
      https://www.googleapis.com/auth/adwords: See, create, change and delete Google Ads accounts and data.
    key_file:
      client_id: /client_email
      private_key: /private_key
    key_page: https://console.cloud.google.com/iam-admin/serviceaccounts
    key_page_title: Open Google Cloud's service accounts
    steps:
      key_page:
        title: Create a service account at Google
        instructions: |-
          - Create a service account in a project where the **Google Ads API** is turned on.
          - Open the service account. On the **Keys** tab, select **Add key**, then **Create new key**. Choose **JSON** as the **Key type** and select **Create**. Google downloads the key as a file. It is the only copy.
          - Copy the service account's email address. You need it in the next step.

          If Google does not let you create a key, your organization has turned key creation off. Ask whoever manages Google Cloud at your company.
      pages:
        - title: Ask Google for access to real accounts
          page: https://console.cloud.google.com/google/ads-apis/overview
          page_title: Open the Google Ads API overview
          instructions: |-
            - Turning the API on gives the project **Test access**, which works on test accounts only.
            - On the **Google Ads API Overview** page of the same project, apply for **Explorer access**. Google reviews it automatically and approves it in most cases.

            You can close this page and come back when Google has approved it.
        - title: Add it as a user in Google Ads
          page: https://ads.google.com/
          page_title: Open Google Ads
          instructions: |-
            - Sign in to your Google Ads account as an administrator and go to **Admin**, then **Access and security**.
            - On the **Users** tab, select the **+** button.
            - Enter the service account's email address in **Email**, select an access level other than **Email only**, and select **Add account**.

            This step needs an administrator of the Google Ads account.
      key:
        title: Enter the details here
        instructions: Choose the key file Google downloaded.
    description: Connect as a service account your company creates at Google.
  - kind: token_exchange
    managed_service_account: true
    read_only: true
    token_endpoint: https://sts.googleapis.com/v1/token
    audience: //iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/auto/providers/auto
    subject_token:
      type: urn:ietf:params:oauth:token-type:jwt
      audience: https://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/auto/providers/auto
    parameters:
      requested_token_type: urn:ietf:params:oauth:token-type:access_token
      scope: https://www.googleapis.com/auth/cloud-platform
    impersonation:
      method: POST
      url: https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/{service_account_email}:generateAccessToken
      request:
        scope: /scope
      issued:
        access_token: /accessToken
        expires_at: /expireTime
    scope: https://www.googleapis.com/auth/adwords
    says:
      https://www.googleapis.com/auth/adwords: See, create, change and delete Google Ads accounts and data.
    placeholders:
      project_number:
        title: Project number
        description: Digits only. Google Cloud shows it on the project's Dashboard, under Project info.
        pattern: '^[0-9]+$'
        example: '123456789012'
      service_account_email:
        title: Service account email
        description: The email address of the service account you created in step 1.
        pattern: '^[^@\s/?#:]+@[^@\s/?#:]+$'
        example: auto@acme-analytics.iam.gserviceaccount.com
    steps:
      pages:
        - title: Add it as a user in Google Ads
          page: https://ads.google.com/
          page_title: Open Google Ads
          instructions: |-
            - Sign in to your Google Ads account as an administrator and go to **Admin**, then **Access and security**.
            - On the **Users** tab, select the **+** button.
            - Enter the service account's email address in **Email**, select an access level other than **Email only**, and select **Add account**.

            This step needs an administrator of the Google Ads account.
    limitation: It only reads, so it can run reports but can't change campaigns, budgets or ad groups.
    description: Connect as a service account that Auto manages. An Admin adds its email address in the app.
  - kind: token_exchange
    token_endpoint: https://sts.googleapis.com/v1/token
    audience: //iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/auto/providers/auto
    subject_token:
      type: urn:ietf:params:oauth:token-type:jwt
      audience: https://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/auto/providers/auto
    parameters:
      requested_token_type: urn:ietf:params:oauth:token-type:access_token
      scope: https://www.googleapis.com/auth/cloud-platform
    impersonation:
      method: POST
      url: https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/{service_account_email}:generateAccessToken
      request:
        scope: /scope
      issued:
        access_token: /accessToken
        expires_at: /expireTime
    scope: https://www.googleapis.com/auth/adwords
    says:
      https://www.googleapis.com/auth/adwords: See, create, change and delete Google Ads accounts and data.
    placeholders:
      project_number:
        title: Project number
        description: Digits only. Google Cloud shows it on the project's Dashboard, under Project info.
        pattern: '^[0-9]+$'
        example: '123456789012'
      service_account_email:
        title: Service account email
        description: The email address of the service account you created in step 1.
        pattern: '^[^@\s/?#:]+@[^@\s/?#:]+$'
        example: auto@acme-analytics.iam.gserviceaccount.com
    key_page: https://console.cloud.google.com/iam-admin/serviceaccounts
    key_page_title: Open Google Cloud's service accounts
    steps:
      key_page:
        title: Create a service account at Google
        instructions: |-
          - Create a service account in a project where the **Google Ads API** is turned on.
          - In the same project, [turn on](https://console.cloud.google.com/apis/enableflow?apiid=sts.googleapis.com,iamcredentials.googleapis.com) the **Security Token Service API** and the **IAM Service Account Credentials API**.
          - Copy the service account's email address. You need it in steps 3, 5 and 6.

          Steps 1 to 3 need whoever manages Google Cloud at your company, with the roles **Workload Identity Pool Admin** and **Service Account Admin** on that project. No key is created.
      pages:
        - title: Create an identity pool at Google
          page: https://console.cloud.google.com/iam-admin/workload-identity-pools
          page_title: Open Google Cloud's identity pools
          instructions: |-
            - Under **Create an identity pool**, enter `auto` in **Name** and select **Continue**.
            - In **Select a provider**, choose **OpenID Connect (OIDC)**. Enter `auto` in **Provider name**.
            - In **Issuer URL**, paste this address: {issuer}
            - Select **Continue**. Under **Configure provider attributes**, map `google.subject` to `assertion.sub`. Select **Save**.

            If you already did this for another Google app in the same project, skip this step.
        - title: Grant access to the service account
          page: https://console.cloud.google.com/iam-admin/workload-identity-pools
          page_title: Open Google Cloud's identity pools
          instructions: |-
            - Open the pool `auto` and select **Grant access**, then **Grant access using Service Account impersonation**.
            - Select the service account you created in step 1.
            - Select **Only identities matching the filter**. In **Attribute name**, choose **subject**. In **Attribute value**, paste this: {subject}
            - Select **Save**, then **Dismiss**.

            Only your organization in Auto can then act as this service account. Don't give access to the whole pool, since every organization in Auto can use it.
        - title: Ask Google for access to real accounts
          page: https://console.cloud.google.com/google/ads-apis/overview
          page_title: Open the Google Ads API overview
          instructions: |-
            - Turning the API on gives the project **Test access**, which works on test accounts only.
            - On the **Google Ads API Overview** page of the same project, apply for **Explorer access**. Google reviews it automatically and approves it in most cases.

            You can close this page and come back when Google has approved it.
        - title: Add it as a user in Google Ads
          page: https://ads.google.com/
          page_title: Open Google Ads
          instructions: |-
            - Sign in to your Google Ads account as an administrator and go to **Admin**, then **Access and security**.
            - On the **Users** tab, select the **+** button.
            - Enter the service account's email address in **Email**, select an access level other than **Email only**, and select **Add account**.

            This step needs an administrator of the Google Ads account.
      key:
        title: Enter the details here
        instructions: |-
          Enter the project number and the email address of the service account from step 1.

          If Connect is refused at first, wait a few minutes and select Connect again: Google can take that long to apply the access you granted in step 3.
    description: Connect as a service account your company creates at Google.
