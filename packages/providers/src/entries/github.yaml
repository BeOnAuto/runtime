name: github
title: GitHub
description: Read repositories, files and commits, and read, open and update issues and pull requests and their comments and reviews on GitHub, through GitHub's MCP server.
website: https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/customize-copilot/extend-copilot-with-tools-and-context/set-up-the-github-mcp-server
type: mcp
url: https://api.githubcopilot.com/mcp/
headers:
  X-MCP-Toolsets: context,repos,issues,pull_requests,users
credentials:
  - kind: authorization
    issuer: https://github.com/login/oauth
    scope: read:org repo
    says:
      read:org: Read organization membership, organization projects and team membership.
      repo: Manage all repositories with collaborators, invitations and webhooks, and organization projects and team memberships.
    clients: [registered]
    description: Sign in to GitHub and allow access to your repositories.
  - kind: secret
    in: header
    name: Authorization
    scheme: Bearer
    description: GitHub fine-grained personal access token
    instructions: >-
      Make a token at [GitHub](https://github.com/settings/personal-access-tokens/new), under **Settings**, **Developer
      settings**, **Personal access tokens**, **Fine-grained tokens**. As **Resource owner**, choose the account or
      organization that owns the repositories, and under **Repository access** select the repositories your functions
      use. Under **Permissions**, give **Contents** read-only access, and **Issues** and **Pull requests** read and
      write access. An organization that requires approval keeps the token pending, reading public resources alone,
      until an organization administrator approves it. The token starts with `github_pat_`.
    key_page: https://github.com/settings/personal-access-tokens/new
    example: github_pat_…
    pattern: ^github_pat_.+$
