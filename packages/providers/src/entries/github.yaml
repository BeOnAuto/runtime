name: github
title: GitHub
description: Read repositories, files and commits, and read, open and update issues and pull requests and their comments and reviews on GitHub, through GitHub's MCP server.
website: https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/customize-copilot/extend-copilot-with-tools-and-context/set-up-the-github-mcp-server
type: mcp
url: https://api.githubcopilot.com/mcp/
headers:
  X-MCP-Toolsets: context,repos,issues,pull_requests,users
credentials:
  - kind: authorization
    account_types: [service, personal]
    issuer: https://github.com/login/oauth
    scope: read:org repo
    says:
      read:org: Read organization membership, organization projects and team membership.
      repo: Manage all repositories with collaborators, invitations and webhooks, and organization projects and team memberships.
    clients: [registered]
    description: Sign in to GitHub and allow access to your repositories.
  - kind: secret
    account_types: [service, personal]
    in: header
    name: Authorization
    scheme: Bearer
    description: GitHub fine-grained personal access token
    instructions: >-
      Make a token at [GitHub](https://github.com/settings/personal-access-tokens/new), under **Settings**, **Developer
      settings**, **Personal access tokens**, **Fine-grained tokens**. As **Resource owner**, choose the account or
      organization that owns the repositories, and under **Repository access** select the repositories your functions
      use. Under **Permissions**, give **Contents** read-only access, and **Issues**, **Pull requests** and
      **Webhooks** read and write access. An organization that requires approval keeps the token pending, reading
      public resources alone, until an organization administrator approves it. The token starts with `github_pat_`.
    key_page: https://github.com/settings/personal-access-tokens/new
    key_page_title: Open GitHub's key page
    steps:
      key_page:
        title: Create a key at GitHub
        instructions: |-
          - Under **Resource owner**, choose the account or organization that owns the repositories.
          - Under **Repository access**, choose **Only select repositories** and pick the ones your playbooks use.
          - Under **Permissions**, set **Contents** to read-only.
          - Set **Issues**, **Pull requests** and **Webhooks** to read and write.
          - Under **Expiration**, choose how long the token lasts. When it ends, reconnect with a new token.

          If the organization that owns the repositories requires approval, GitHub keeps the token pending until an owner of that organization approves it. Until then, the token can read only what is public on GitHub.
      key:
        title: Paste the key here
        instructions: On GitHub's page, select **Generate token**, then copy the token and paste it here.
    example: github_pat_…
    pattern: ^github_pat_.+$
events:
  types:
    - type: com.github.issues.opened
      title: An issue is opened
      subject:
        title: Repository
        required: true
      data:
        type: object
        properties:
          number:
            type: integer
            description: The number of the issue in its repository.
          title:
            type: string
            description: The title of the issue.
          body:
            type: string
            description: What the issue says, in Markdown.
          author:
            type: string
            description: The GitHub username of whoever opened the issue.
          html_url:
            type: string
            description: The link to the issue on GitHub.
    - type: com.github.issue_comment.created
      title: A comment is added to an issue or pull request
      subject:
        title: Repository
        required: true
      data:
        type: object
        properties:
          number:
            type: integer
            description: The number of the issue or pull request the comment is on.
          title:
            type: string
            description: The title of the issue or pull request the comment is on.
          body:
            type: string
            description: What the comment says, in Markdown.
          author:
            type: string
            description: The GitHub username of whoever wrote the comment.
          html_url:
            type: string
            description: The link to the comment on GitHub.
    - type: com.github.pull_request.opened
      title: A pull request is opened
      subject:
        title: Repository
        required: true
      data:
        type: object
        properties:
          number:
            type: integer
            description: The number of the pull request in its repository.
          title:
            type: string
            description: The title of the pull request.
          body:
            type: string
            description: What the pull request says, in Markdown.
          author:
            type: string
            description: The GitHub username of whoever opened the pull request.
          html_url:
            type: string
            description: The link to the pull request on GitHub.
    - type: com.github.pull_request.closed
      title: A pull request is closed
      subject:
        title: Repository
        required: true
      data:
        type: object
        properties:
          number:
            type: integer
            description: The number of the pull request in its repository.
          title:
            type: string
            description: The title of the pull request.
          author:
            type: string
            description: The GitHub username of whoever opened the pull request.
          html_url:
            type: string
            description: The link to the pull request on GitHub.
          merged:
            type: boolean
            description: Whether the pull request was merged. It is false when it was closed without merging.
  identity:
    method: GET
    url: https://api.github.com/user
    identified:
      id: /id
      name: /login
  destinations:
    - type: webhook
      per: subscription
      topic: '{{ with.owner }}/{{ with.repo }}'
      subscribe:
        method: POST
        url: https://api.github.com/repos/{{ topic }}/hooks
        body:
          name: web
          active: true
          events: [issue_comment, pull_request_review, pull_request_review_comment, issues, pull_request]
          config:
            url: '{{ webhook_url }}'
            content_type: json
            secret: '{{ secret }}'
        subscribed:
          id: /id
      unsubscribe:
        method: DELETE
        url: https://api.github.com/repos/{{ topic }}/hooks/{{ subscription.id }}
      verify:
        scheme: hmac
        secret: subscription
        hash: sha256
        signed_payload: '{payload}'
        signature: $request.header.X-Hub-Signature-256
        prefix: sha256=
        encoding: hex
      filter:
        when:
          $request.header.X-GitHub-Event: [issue_comment, pull_request_review, pull_request_review_comment]
          $request.body#/action: [created, submitted]
        subscription: $request.header.X-GitHub-Hook-ID
      events:
        - type: com.github.issues.opened
          when:
            $request.body#/action: [opened]
          id: [$request.body#/issue/node_id]
          time: $request.body#/issue/created_at
          subject: $request.body#/repository/full_name
          topic: '{{ subject }}'
          automatic:
            $request.body#/sender/type: [Bot]
          actor: $request.body#/sender/id
          data:
            number: $request.body#/issue/number
            title: $request.body#/issue/title
            body: $request.body#/issue/body
            author: $request.body#/issue/user/login
            html_url: $request.body#/issue/html_url
        - type: com.github.issue_comment.created
          when:
            $request.body#/action: [created]
          id: [$request.body#/issue/node_id, $request.body#/comment/node_id]
          time: $request.body#/comment/created_at
          subject: $request.body#/repository/full_name
          topic: '{{ subject }}'
          automatic:
            $request.body#/sender/type: [Bot]
          actor: $request.body#/sender/id
          data:
            number: $request.body#/issue/number
            title: $request.body#/issue/title
            body: $request.body#/comment/body
            author: $request.body#/comment/user/login
            html_url: $request.body#/comment/html_url
        - type: com.github.pull_request.opened
          when:
            $request.body#/action: [opened]
          id: [$request.body#/pull_request/node_id]
          time: $request.body#/pull_request/created_at
          subject: $request.body#/repository/full_name
          topic: '{{ subject }}'
          automatic:
            $request.body#/sender/type: [Bot]
          actor: $request.body#/sender/id
          data:
            number: $request.body#/pull_request/number
            title: $request.body#/pull_request/title
            body: $request.body#/pull_request/body
            author: $request.body#/pull_request/user/login
            html_url: $request.body#/pull_request/html_url
        - type: com.github.pull_request.closed
          when:
            $request.body#/action: [closed]
          id: [$request.body#/pull_request/node_id, $request.body#/pull_request/closed_at]
          time: $request.body#/pull_request/closed_at
          subject: $request.body#/repository/full_name
          topic: '{{ subject }}'
          automatic:
            $request.body#/sender/type: [Bot]
          actor: $request.body#/sender/id
          data:
            number: $request.body#/pull_request/number
            title: $request.body#/pull_request/title
            author: $request.body#/pull_request/user/login
            html_url: $request.body#/pull_request/html_url
            merged: $request.body#/pull_request/merged
