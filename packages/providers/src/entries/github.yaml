name: github
title: GitHub
description: Read repositories, files and commits, and read, open and update issues and pull requests and their comments and reviews on GitHub, through GitHub's MCP server.
summary: Lets your playbooks read repositories and work with issues and pull requests on GitHub.
website: https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/customize-copilot/extend-copilot-with-tools-and-context/set-up-the-github-mcp-server
type: mcp
url: https://api.githubcopilot.com/mcp/
headers:
  X-MCP-Toolsets: context,repos,issues,pull_requests,users
credentials:
  - kind: authorization
    permissions: application
    issuer: https://github.com/login/oauth
    authorization_endpoint: https://github.com/login/oauth/authorize
    token_endpoint: https://github.com/login/oauth/access_token
    clients: [registered]
    installation:
      issuer: https://api.github.com
      installations:
        method: GET
        url: https://api.github.com/user/installations?per_page=100
        list: /installations
        id: /id
        name: /account/login
        account: /account/id
        personal:
          /account/type: [User]
      userinfo:
        method: GET
        url: https://api.github.com/user
        id: /id
      membership:
        method: GET
        url: https://api.github.com/user/memberships/orgs/{account_name}
        admin:
          /role: [admin]
          /state: [active]
      returned:
        installation: installation_id
        requested:
          setup_action: [request]
      token_request:
        method: POST
        url: https://api.github.com/app/installations/{installation_id}/access_tokens
        issued:
          access_token: /token
          expires_at: /expires_at
    limitation: You choose the repositories at GitHub. It must be installed by an owner of your GitHub organization.
    description: >-
      Auto's GitHub app. An owner of the GitHub organization installs it and chooses the repositories it can reach. It
      asks for no values.
  - kind: authorization
    account_types: [service, personal]
    issuer: https://github.com/login/oauth
    scope: read:org repo
    says:
      read:org: Read organization membership, organization projects and team membership.
      repo: Manage all repositories with collaborators, invitations and webhooks, and organization projects and team memberships.
    clients: [registered]
    description: Sign in to GitHub and allow access to your repositories.
  - kind: secret
    account_types: [service, personal]
    in: header
    name: Authorization
    scheme: Bearer
    description: GitHub fine-grained personal access token
    instructions: >-
      Make a token at [GitHub](https://github.com/settings/personal-access-tokens/new), under **Settings**, **Developer
      settings**, **Personal access tokens**, **Fine-grained tokens**. As **Resource owner**, choose the account or
      organization that owns the repositories, and under **Repository access** select the repositories your functions
      use. Under **Permissions**, give **Contents** read-only access, and **Issues**, **Pull requests** and
      **Webhooks** read and write access. An organization that requires approval keeps the token pending, reading
      public resources alone, until an organization administrator approves it. The token starts with `github_pat_`.
    key_page: https://github.com/settings/personal-access-tokens/new
    key_page_title: Open GitHub's key page
    steps:
      key_page:
        title: Create a key at GitHub
        instructions: |-
          - Under **Resource owner**, choose the account or organization that owns the repositories.
          - Under **Repository access**, choose **Only select repositories** and pick the ones your playbooks use.
          - Under **Permissions**, set **Contents** to read-only.
          - Set **Issues**, **Pull requests** and **Webhooks** to read and write.
          - Under **Expiration**, choose how long the token lasts. When it ends, reconnect with a new token.

          If the organization that owns the repositories requires approval, GitHub keeps the token pending until an owner of that organization approves it. Until then, the token can read only what is public on GitHub.
      key:
        title: Paste the key here
        instructions: On GitHub's page, select **Generate token**, then copy the token and paste it here.
    example: github_pat_…
    pattern: ^github_pat_.+$
  - kind: jwt_bearer
    issuer: https://api.github.com
    client_id: '{app_id}'
    key_file:
      format: pem
    token_request:
      method: POST
      url: https://api.github.com/app/installations/{installation_id}/access_tokens
      issued:
        access_token: /token
        expires_at: /expires_at
    placeholders:
      app_id:
        title: App ID
        description: The App ID on the settings page of the GitHub App.
        pattern: '^[0-9]+$'
        example: '1234567'
      installation_id:
        title: Installation ID
        description: The number at the end of the address of the page GitHub opens after the app is installed.
        pattern: '^[0-9]+$'
        example: '12345678'
    key_page: https://github.com/settings/organizations
    key_page_title: Open GitHub's developer settings
    steps:
      key_page:
        title: Register a GitHub App
        instructions: |-
          - In your organization's **Settings**, select **Developer settings**, then **GitHub Apps**, then **New GitHub App**.
          - Enter a **GitHub App name** and a **Homepage URL**.
          - Under **Webhook**, deselect **Active**.
          - Under **Permissions**, set **Contents** to read-only, and **Issues**, **Pull requests** and **Webhooks** to read and write.
          - Under **Where can this GitHub App be installed?**, select **Only on this account**.
          - Select **Create GitHub App**.

          This needs an owner of your GitHub organization.
      pages:
        - title: Create its private key
          page: https://github.com/settings/organizations
          page_title: Open GitHub's developer settings
          instructions: |-
            - On the app's page, select **Credentials**, then **Key pairs**, then **New key**.
            - GitHub downloads a file ending in .pem. Keep it: GitHub stores only the public part.
        - title: Install the app on your repositories
          page: https://github.com/settings/organizations
          page_title: Open GitHub's developer settings
          instructions: |-
            - On the app's page, select **Install App**, then **Install** next to your organization.
            - Choose **Only select repositories**, pick the ones your playbooks use, then select **Install**.
            - GitHub then opens the installation's page. Its address ends in a number: that is the Installation ID.
      key:
        title: Enter the app's details here
        instructions: Choose the file ending in .pem that GitHub downloaded, and enter the App ID and the Installation ID.
    limitation: It can't reach a repository until it is installed on it.
    description: The App ID, private key and installation ID of a GitHub App your company registers and installs on its repositories.
events:
  types:
    - type: com.github.issues.opened
      title: An issue is opened
      subject:
        title: Repository
        required: true
        description: >-
          The repository as owner/name, such as octo-org/hello-world, written as GitHub shows it. The connection's
          account needs admin access to it. A connection made as an app needs the Webhooks permission and to be
          installed on it.
      data:
        type: object
        properties:
          number:
            type: integer
            description: The number of the issue in its repository.
          title:
            type: string
            description: The title of the issue.
          body:
            type: string
            description: What the issue says, in Markdown.
          author:
            type: string
            description: The GitHub username of whoever opened the issue.
          html_url:
            type: string
            description: The link to the issue on GitHub.
    - type: com.github.issue_comment.created
      title: A comment is added to an issue or pull request
      subject:
        title: Repository
        required: true
        description: >-
          The repository as owner/name, such as octo-org/hello-world, written as GitHub shows it. The connection's
          account needs admin access to it. A connection made as an app needs the Webhooks permission and to be
          installed on it.
      data:
        type: object
        properties:
          number:
            type: integer
            description: The number of the issue or pull request the comment is on.
          title:
            type: string
            description: The title of the issue or pull request the comment is on.
          body:
            type: string
            description: What the comment says, in Markdown.
          author:
            type: string
            description: The GitHub username of whoever wrote the comment.
          html_url:
            type: string
            description: The link to the comment on GitHub.
    - type: com.github.pull_request.opened
      title: A pull request is opened
      subject:
        title: Repository
        required: true
        description: >-
          The repository as owner/name, such as octo-org/hello-world, written as GitHub shows it. The connection's
          account needs admin access to it. A connection made as an app needs the Webhooks permission and to be
          installed on it.
      data:
        type: object
        properties:
          number:
            type: integer
            description: The number of the pull request in its repository.
          title:
            type: string
            description: The title of the pull request.
          body:
            type: string
            description: What the pull request says, in Markdown.
          author:
            type: string
            description: The GitHub username of whoever opened the pull request.
          html_url:
            type: string
            description: The link to the pull request on GitHub.
    - type: com.github.pull_request.closed
      title: A pull request is closed
      subject:
        title: Repository
        required: true
        description: >-
          The repository as owner/name, such as octo-org/hello-world, written as GitHub shows it. The connection's
          account needs admin access to it. A connection made as an app needs the Webhooks permission and to be
          installed on it.
      data:
        type: object
        properties:
          number:
            type: integer
            description: The number of the pull request in its repository.
          title:
            type: string
            description: The title of the pull request.
          author:
            type: string
            description: The GitHub username of whoever opened the pull request.
          html_url:
            type: string
            description: The link to the pull request on GitHub.
          merged:
            type: boolean
            description: Whether the pull request was merged. It is false when it was closed without merging.
  identity:
    method: POST
    url: https://api.github.com/graphql
    body:
      query: query { viewer { databaseId login } }
    identified:
      id: /data/viewer/databaseId
      name: /data/viewer/login
  destinations:
    - type: webhook
      per: subscription
      topic: '{{ with.owner }}/{{ with.repo }}'
      subscribe:
        method: POST
        url: https://api.github.com/repos/{{ topic }}/hooks
        body:
          name: web
          active: true
          events: [issue_comment, pull_request_review, pull_request_review_comment, issues, pull_request]
          config:
            url: '{{ webhook_url }}'
            content_type: json
            secret: '{{ secret }}'
        subscribed:
          id: /id
      unsubscribe:
        method: DELETE
        url: https://api.github.com/repos/{{ topic }}/hooks/{{ subscription.id }}
      verify:
        scheme: hmac
        secret: subscription
        hash: sha256
        signed_payload: '{payload}'
        signature: $request.header.X-Hub-Signature-256
        prefix: sha256=
        encoding: hex
      filter:
        when:
          $request.header.X-GitHub-Event: [issue_comment, pull_request_review, pull_request_review_comment]
          $request.body#/action: [created, submitted]
        subscription: $request.header.X-GitHub-Hook-ID
      events:
        - type: com.github.issues.opened
          when:
            $request.body#/action: [opened]
          id: [$request.body#/issue/node_id]
          time: $request.body#/issue/created_at
          subject: $request.body#/repository/full_name
          topic: '{{ subject }}'
          automatic:
            $request.body#/sender/type: [Bot]
          actor: $request.body#/sender/id
          data:
            number: $request.body#/issue/number
            title: $request.body#/issue/title
            body: $request.body#/issue/body
            author: $request.body#/issue/user/login
            html_url: $request.body#/issue/html_url
        - type: com.github.issue_comment.created
          when:
            $request.body#/action: [created]
          id: [$request.body#/issue/node_id, $request.body#/comment/node_id]
          time: $request.body#/comment/created_at
          subject: $request.body#/repository/full_name
          topic: '{{ subject }}'
          automatic:
            $request.body#/sender/type: [Bot]
          actor: $request.body#/sender/id
          data:
            number: $request.body#/issue/number
            title: $request.body#/issue/title
            body: $request.body#/comment/body
            author: $request.body#/comment/user/login
            html_url: $request.body#/comment/html_url
        - type: com.github.pull_request.opened
          when:
            $request.body#/action: [opened]
          id: [$request.body#/pull_request/node_id]
          time: $request.body#/pull_request/created_at
          subject: $request.body#/repository/full_name
          topic: '{{ subject }}'
          automatic:
            $request.body#/sender/type: [Bot]
          actor: $request.body#/sender/id
          data:
            number: $request.body#/pull_request/number
            title: $request.body#/pull_request/title
            body: $request.body#/pull_request/body
            author: $request.body#/pull_request/user/login
            html_url: $request.body#/pull_request/html_url
        - type: com.github.pull_request.closed
          when:
            $request.body#/action: [closed]
          id: [$request.body#/pull_request/node_id, $request.body#/pull_request/closed_at]
          time: $request.body#/pull_request/closed_at
          subject: $request.body#/repository/full_name
          topic: '{{ subject }}'
          automatic:
            $request.body#/sender/type: [Bot]
          actor: $request.body#/sender/id
          data:
            number: $request.body#/pull_request/number
            title: $request.body#/pull_request/title
            author: $request.body#/pull_request/user/login
            html_url: $request.body#/pull_request/html_url
            merged: $request.body#/pull_request/merged
    - type: polling
      read:
        method: POST
        url: https://api.github.com/graphql
        body:
          query: >-
            query($owner: String!, $name: String!, $after: String) { repository(owner: $owner, name: $name) {
            issues(first: 50, after: $after, orderBy: { field: CREATED_AT, direction: DESC }) { nodes { id number
            title body url createdAt repository { nameWithOwner } author { __typename login ... on User { databaseId }
            } } pageInfo { endCursor } } } }
          variables:
            owner: '{{ topic | remove_first: "issues in " | split: "/" | first }}'
            name: '{{ topic | split: "/" | last }}'
            after: '{{ page_token }}'
        start: '{{ now }}'
        list: /data/repository/issues/nodes
        order: newest_first
        cursor: /createdAt
        next_page_token: /data/repository/issues/pageInfo/endCursor
      events:
        - type: com.github.issues.opened
          when: {}
          id: [$message.payload#/id]
          time: $message.payload#/createdAt
          subject: $message.payload#/repository/nameWithOwner
          topic: 'issues in {{ subject }}'
          automatic:
            $message.payload#/author/__typename: [Bot]
          actor: $message.payload#/author/databaseId
          data:
            number: $message.payload#/number
            title: $message.payload#/title
            body: $message.payload#/body
            author: $message.payload#/author/login
            html_url: $message.payload#/url
    - type: polling
      read:
        method: POST
        url: https://api.github.com/graphql
        body:
          query: >-
            query($owner: String!, $name: String!, $after: String) { repository(owner: $owner, name: $name) {
            pullRequests(first: 50, after: $after, orderBy: { field: CREATED_AT, direction: DESC }) { nodes { id
            number title body url createdAt repository { nameWithOwner } author { __typename login ... on User {
            databaseId } } } pageInfo { endCursor } } } }
          variables:
            owner: '{{ topic | remove_first: "pull requests in " | split: "/" | first }}'
            name: '{{ topic | split: "/" | last }}'
            after: '{{ page_token }}'
        start: '{{ now }}'
        list: /data/repository/pullRequests/nodes
        order: newest_first
        cursor: /createdAt
        next_page_token: /data/repository/pullRequests/pageInfo/endCursor
      events:
        - type: com.github.pull_request.opened
          when: {}
          id: [$message.payload#/id]
          time: $message.payload#/createdAt
          subject: $message.payload#/repository/nameWithOwner
          topic: 'pull requests in {{ subject }}'
          automatic:
            $message.payload#/author/__typename: [Bot]
          actor: $message.payload#/author/databaseId
          data:
            number: $message.payload#/number
            title: $message.payload#/title
            body: $message.payload#/body
            author: $message.payload#/author/login
            html_url: $message.payload#/url
