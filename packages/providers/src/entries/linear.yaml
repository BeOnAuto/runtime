name: linear
title: Linear
description: Find, create and update Linear issues, projects and comments through Linear's MCP server, as the account that signs in or as your company's own application, which sees public teams and the private teams it was added to.
summary: Lets your playbooks find, create and update issues, projects and comments in Linear.
website: https://linear.app/docs/mcp
type: mcp
url: https://mcp.linear.app/mcp
marks:
  reads:
    - list_issues
credentials:
  - kind: client_credentials
    issuer: https://api.linear.app
    scope: read,write
    says:
      read,write: Read, create, change, archive and delete the issues, projects, comments and other data the application can see.
    key_page: https://linear.app/settings/api/applications/new
    key_page_title: Open Linear's new application page
    steps:
      key_page:
        title: Create an OAuth application in Linear
        instructions: |-
          - Enter an **Application name**, and your company's name and website as **Developer name** and **Developer URL**.
          - Leave **Redirect URIs** blank.
          - Turn on **Client credentials**, then create the application.

          The application sees every public team. To let it into a private team, change its team access on the application's page in Linear.
      key:
        title: Enter the app's details here
        instructions: Paste the client ID and client secret from the application's page in Linear.
    limitation: It can't see a private team until someone adds it to that team.
    description: The client ID and secret of an OAuth application your company creates in Linear, with client credentials tokens turned on.
  - kind: authorization
    account_types: [service, personal]
    issuer: https://mcp.linear.app
    scope: read write
    says:
      read: Read the issues, projects, comments, teams and other data the Linear account can see.
      write: Create, change, archive and delete issues, projects, comments and other data as the Linear account.
    clients: [registered, metadata_document, dynamic]
    description: Sign in to Linear, choose a workspace and allow access.
events:
  types:
    - type: app.linear.issue.created
      title: An issue is created
      subject:
        title: Team
        required: true
        description: The team the issue is in, by its name as Linear shows it, such as Engineering.
      data:
        type: object
        properties:
          identifier:
            type: string
            description: The issue's ID as Linear shows it, such as ENG-123.
          title:
            type: string
            description: The title of the issue.
          url:
            type: string
            description: The link to the issue in Linear.
          status:
            type: string
            description: The name of the issue's status, such as In Progress or Done.
          status_type:
            type: string
            description: >-
              The kind of status the issue is in, whatever the team calls it: triage, backlog, unstarted, started,
              completed or canceled.
          priority:
            type: string
            description: The issue's priority, such as Urgent, High, Medium, Low or No priority.
          assignee:
            type: string
            description: The name of the person the issue is assigned to, if anyone.
          created_at:
            type: string
            description: When the issue was created.
          completed_at:
            type: string
            description: When the issue was completed, if it is.
    - type: app.linear.issue.updated
      title: An issue is created or updated
      subject:
        title: Team
        required: true
        description: The team the issue is in, by its name as Linear shows it, such as Engineering.
      data:
        type: object
        properties:
          identifier:
            type: string
            description: The issue's ID as Linear shows it, such as ENG-123.
          title:
            type: string
            description: The title of the issue.
          url:
            type: string
            description: The link to the issue in Linear.
          status:
            type: string
            description: The name of the issue's status, such as In Progress or Done.
          status_type:
            type: string
            description: >-
              The kind of status the issue is in, whatever the team calls it: triage, backlog, unstarted, started,
              completed or canceled.
          priority:
            type: string
            description: The issue's priority, such as Urgent, High, Medium, Low or No priority.
          assignee:
            type: string
            description: The name of the person the issue is assigned to, if anyone.
          created_at:
            type: string
            description: When the issue was created.
          completed_at:
            type: string
            description: When the issue was completed, if it is.
    - type: app.linear.issue.completed
      title: An issue is completed
      subject:
        title: Team
        required: true
        description: The team the issue is in, by its name as Linear shows it, such as Engineering.
      data:
        type: object
        properties:
          identifier:
            type: string
            description: The issue's ID as Linear shows it, such as ENG-123.
          title:
            type: string
            description: The title of the issue.
          url:
            type: string
            description: The link to the issue in Linear.
          status:
            type: string
            description: The name of the issue's status, such as In Progress or Done.
          status_type:
            type: string
            description: >-
              The kind of status the issue is in, whatever the team calls it: triage, backlog, unstarted, started,
              completed or canceled.
          priority:
            type: string
            description: The issue's priority, such as Urgent, High, Medium, Low or No priority.
          assignee:
            type: string
            description: The name of the person the issue is assigned to, if anyone.
          created_at:
            type: string
            description: When the issue was created.
          completed_at:
            type: string
            description: When the issue was completed, if it is.
  identity:
    tool: whoami
    identified:
      id: /user/id
      name: /user/name
    account: /workspace/id
  destinations:
    - type: polling
      read:
        tool: list_issues
        with:
          team: '{{ topic | remove_first: "issues created in " }}'
          createdAt: '{{ since }}'
          orderBy: createdAt
          limit: 50
          cursor: '{{ page_token }}'
          fields:
            - uuid
            - title
            - url
            - createdAt
            - updatedAt
            - completedAt
            - status
            - statusType
            - priority
            - assignee
            - team
            - createdById
        start: '{{ now }}'
        list: /issues
        order: newest_first
        cursor: /createdAt
        next_page_token: /cursor
      events:
        - type: app.linear.issue.created
          when: {}
          id: [$message.payload#/uuid]
          time: $message.payload#/createdAt
          subject: $message.payload#/team
          topic: 'issues created in {{ subject }}'
          actor: $message.payload#/createdById
          data:
            identifier: $message.payload#/id
            title: $message.payload#/title
            url: $message.payload#/url
            status: $message.payload#/status
            status_type: $message.payload#/statusType
            priority: $message.payload#/priority/name
            assignee: $message.payload#/assignee
            created_at: $message.payload#/createdAt
            completed_at: $message.payload#/completedAt
    - type: polling
      read:
        tool: list_issues
        with:
          team: '{{ topic | remove_first: "issues created or updated in " }}'
          updatedAt: '{{ since }}'
          orderBy: updatedAt
          limit: 50
          cursor: '{{ page_token }}'
          fields: [uuid, title, url, createdAt, updatedAt, completedAt, status, statusType, priority, assignee, team]
        start: '{{ now }}'
        list: /issues
        order: newest_first
        cursor: /updatedAt
        next_page_token: /cursor
      events:
        - type: app.linear.issue.updated
          when: {}
          id: [$message.payload#/uuid, $message.payload#/updatedAt]
          time: $message.payload#/updatedAt
          subject: $message.payload#/team
          topic: 'issues created or updated in {{ subject }}'
          data:
            identifier: $message.payload#/id
            title: $message.payload#/title
            url: $message.payload#/url
            status: $message.payload#/status
            status_type: $message.payload#/statusType
            priority: $message.payload#/priority/name
            assignee: $message.payload#/assignee
            created_at: $message.payload#/createdAt
            completed_at: $message.payload#/completedAt
    - type: polling
      read:
        tool: list_issues
        with:
          team: '{{ topic | remove_first: "issues completed in " }}'
          updatedAt: '{{ since }}'
          completedAt: '{{ since }}'
          orderBy: updatedAt
          limit: 50
          cursor: '{{ page_token }}'
          fields: [uuid, title, url, createdAt, updatedAt, completedAt, status, statusType, priority, assignee, team]
        start: '{{ now }}'
        list: /issues
        order: newest_first
        cursor: /updatedAt
        next_page_token: /cursor
      events:
        - type: app.linear.issue.completed
          when: {}
          id: [$message.payload#/uuid, $message.payload#/completedAt]
          time: $message.payload#/completedAt
          subject: $message.payload#/team
          topic: 'issues completed in {{ subject }}'
          data:
            identifier: $message.payload#/id
            title: $message.payload#/title
            url: $message.payload#/url
            status: $message.payload#/status
            status_type: $message.payload#/statusType
            priority: $message.payload#/priority/name
            assignee: $message.payload#/assignee
            created_at: $message.payload#/createdAt
            completed_at: $message.payload#/completedAt
