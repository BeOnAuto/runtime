name: search-ads-360
title: Search Ads 360
description: Run Search Ads 360 reports with its query language, and list the accounts, report fields and custom columns you can read.
summary: Lets your playbooks run Search Ads 360 reports.
website: https://developers.google.com/search-ads/reporting/overview
type: openapi
document: documents/search-ads-360.openapi.json
headers:
  login-customer-id: '{manager_id}'
marks:
  reads:
    - searchads360.customers.searchAds360.search
    - searchads360.searchAds360Fields.search
placeholders:
  manager_id:
    title: Manager account customer ID
    description: "The customer ID of the manager account you reach the account through, if you use one: ten digits, without hyphens. If you added the service account at a manager account, enter that account's customer ID."
    pattern: '^[0-9]{10}$'
    example: '1234567890'
    required: false
credentials:
  - kind: authorization
    account_types: [personal]
    issuer: https://accounts.google.com
    scope: https://www.googleapis.com/auth/doubleclicksearch
    says:
      https://www.googleapis.com/auth/doubleclicksearch: Read and manage Search Ads 360 advertising data.
    parameters:
      access_type: offline
      prompt: consent
    clients: [registered]
    key_page: https://console.developers.google.com/auth/clients
    key_page_title: Open Google Auth Platform's clients
    steps:
      key_page:
        title: Create an OAuth client at Google
        instructions: |-
          - Use a project where the **Search Ads 360 Reporting API** is turned on.
          - If you see **Google Auth platform not configured yet**, select **Get Started** and follow its steps. Under **Audience**, select **Internal**, so that only members of your organization can sign in.
          - Select **Create client**. In **Application type**, select **Web application**.
          - Under **Authorized redirect URIs**, select **Add URI** and add the redirect URL below.
          - Select **Create**. Copy the client ID and the client secret now: Google shows the full secret only once. You enter both in step 2.

          If the person who signs in is outside your organization, select **External** and publish the app. While the app is in **Testing**, Google ends each sign-in after seven days.
    description: Sign in to Google and allow Search Ads 360 reporting.
  - kind: token_exchange
    managed_service_account: true
    token_endpoint: https://sts.googleapis.com/v1/token
    audience: //iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/auto/providers/auto
    subject_token:
      type: urn:ietf:params:oauth:token-type:jwt
      audience: https://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/auto/providers/auto
    parameters:
      requested_token_type: urn:ietf:params:oauth:token-type:access_token
      scope: https://www.googleapis.com/auth/cloud-platform
    impersonation:
      method: POST
      url: https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/{service_account_email}:generateAccessToken
      request:
        scope: /scope
      issued:
        access_token: /accessToken
        expires_at: /expireTime
    scope: https://www.googleapis.com/auth/doubleclicksearch
    says:
      https://www.googleapis.com/auth/doubleclicksearch: Read and manage Search Ads 360 advertising data.
    placeholders:
      project_number:
        title: Project number
        description: Digits only. Google Cloud shows it on the project's Dashboard, under Project info.
        pattern: '^[0-9]+$'
        example: '123456789012'
      service_account_email:
        title: Service account email
        description: The email address of the service account you created in step 1.
        pattern: '^[^@\s/?#:]+@[^@\s/?#:]+$'
        example: auto@acme-analytics.iam.gserviceaccount.com
    steps:
      pages:
        - title: Add it as a user in Search Ads 360
          page: https://searchads.google.com/
          page_title: Open Search Ads 360
          instructions: |-
            - Go to a manager or sub-manager account. Under **Tools and settings**, select **Setup**, then **Access & security**.
            - On the **Users** tab, select the plus button.
            - Enter the service account's email address and, under **Select account access level**, choose a user role.
            - Select **Add account**.

            This step needs an Admin of the Search Ads 360 manager account.
    description: Connect as a service account that Auto manages. An Admin adds its email address in the app.
  - kind: token_exchange
    token_endpoint: https://sts.googleapis.com/v1/token
    audience: //iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/auto/providers/auto
    subject_token:
      type: urn:ietf:params:oauth:token-type:jwt
      audience: https://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/auto/providers/auto
    parameters:
      requested_token_type: urn:ietf:params:oauth:token-type:access_token
      scope: https://www.googleapis.com/auth/cloud-platform
    impersonation:
      method: POST
      url: https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/{service_account_email}:generateAccessToken
      request:
        scope: /scope
      issued:
        access_token: /accessToken
        expires_at: /expireTime
    scope: https://www.googleapis.com/auth/doubleclicksearch
    says:
      https://www.googleapis.com/auth/doubleclicksearch: Read and manage Search Ads 360 advertising data.
    placeholders:
      project_number:
        title: Project number
        description: Digits only. Google Cloud shows it on the project's Dashboard, under Project info.
        pattern: '^[0-9]+$'
        example: '123456789012'
      service_account_email:
        title: Service account email
        description: The email address of the service account you created in step 1.
        pattern: '^[^@\s/?#:]+@[^@\s/?#:]+$'
        example: auto@acme-analytics.iam.gserviceaccount.com
    key_page: https://console.cloud.google.com/iam-admin/serviceaccounts
    key_page_title: Open Google Cloud's service accounts
    steps:
      key_page:
        title: Create a service account at Google
        instructions: |-
          - Create a service account in a project where the **Search Ads 360 Reporting API** is turned on.
          - In the same project, [turn on](https://console.cloud.google.com/apis/enableflow?apiid=sts.googleapis.com,iamcredentials.googleapis.com) the **Security Token Service API** and the **IAM Service Account Credentials API**.
          - Copy the service account's email address. You need it in steps 3, 4 and 5.

          Steps 1 to 3 need whoever manages Google Cloud at your company, with the roles **Workload Identity Pool Admin** and **Service Account Admin** on that project. No key is created.
      pages:
        - title: Create an identity pool at Google
          page: https://console.cloud.google.com/iam-admin/workload-identity-pools
          page_title: Open Google Cloud's identity pools
          instructions: |-
            - Under **Create an identity pool**, enter `auto` in **Name** and select **Continue**.
            - In **Select a provider**, choose **OpenID Connect (OIDC)**. Enter `auto` in **Provider name**.
            - In **Issuer URL**, paste this address: {issuer}
            - Select **Continue**. Under **Configure provider attributes**, map `google.subject` to `assertion.sub`. Select **Save**.

            If you already did this for another Google app in the same project, skip this step.
        - title: Grant access to the service account
          page: https://console.cloud.google.com/iam-admin/workload-identity-pools
          page_title: Open Google Cloud's identity pools
          instructions: |-
            - Open the pool `auto` and select **Grant access**, then **Grant access using Service Account impersonation**.
            - Select the service account you created in step 1.
            - Select **Only identities matching the filter**. In **Attribute name**, choose **subject**. In **Attribute value**, paste this: {subject}
            - Select **Save**, then **Dismiss**.

            Only your organization in Auto can then act as this service account. Don't give access to the whole pool, since every organization in Auto can use it.
        - title: Add it as a user in Search Ads 360
          page: https://searchads.google.com/
          page_title: Open Search Ads 360
          instructions: |-
            - Go to a manager or sub-manager account. Under **Tools and settings**, select **Setup**, then **Access & security**.
            - On the **Users** tab, select the plus button.
            - Enter the service account's email address and, under **Select account access level**, choose a user role.
            - Select **Add account**.

            This step needs an Admin of the Search Ads 360 manager account.
      key:
        title: Enter the details here
        instructions: Enter the project number and the email address of the service account from step 1.
    description: Connect as a service account your company creates at Google.
