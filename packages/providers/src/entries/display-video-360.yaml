name: display-video-360
title: Display & Video 360
description: Read Display & Video 360 partners, advertisers, campaigns, insertion orders, line items, ad groups and creatives, and change campaigns, insertion orders and line items.
summary: Lets your playbooks read and change Display & Video 360 campaigns, insertion orders and line items.
website: https://developers.google.com/display-video/api/guides/quickstart/overview
type: openapi
document: documents/display-video-360.openapi.json
credentials:
  - kind: authorization
    account_types: [personal]
    issuer: https://accounts.google.com
    scope: https://www.googleapis.com/auth/display-video
    says:
      https://www.googleapis.com/auth/display-video: See, create, change and permanently delete Display & Video 360 entities and reports.
    parameters:
      access_type: offline
      prompt: consent
    clients: [registered]
    key_page: https://console.developers.google.com/auth/clients
    key_page_title: Open Google Auth Platform's clients
    steps:
      key_page:
        title: Create an OAuth client at Google
        instructions: |-
          - Use a project where the **Display & Video 360 API** is turned on.
          - If you see **Google Auth platform not configured yet**, select **Get Started** and follow its steps. Under **Audience**, select **Internal**, so that only members of your organization can sign in.
          - Select **Create client**. In **Application type**, select **Web application**.
          - Under **Authorized redirect URIs**, select **Add URI** and add the redirect URL below.
          - Select **Create**. Copy the client ID and the client secret now: Google shows the full secret only once. You enter both in step 2.

          If the person who signs in is outside your organization, select **External** and publish the app. While the app is in **Testing**, Google ends each sign-in after seven days.
    description: Sign in to Google and allow Display & Video 360.
