name: slack-bot
title: Slack Bot
description: Read channels, conversation history, threads, people and reactions, and post and update messages and add reactions as the bot of a Slack app installed in your workspace, through the Slack Web API.
website: https://docs.slack.dev/apis/web-api/
type: openapi
document: documents/slack.openapi.json
failure_codes:
  succeeded: /ok
  code: /error
  key_refused: [invalid_auth, not_authed, token_revoked, token_expired, account_inactive]
  scope_lacking: [missing_scope]
  rate_limited: [ratelimited, rate_limited]
renders: slack
conversations:
  tell: all
  automatic: /bot_id
  reply:
    tool: chat_postMessage
    with:
      body:
        channel: '{{ sent.conversation }}'
        thread_ts: '{{ reply.to | default: reply.id | default: sent.id }}'
        text: '{{ message }}'
    sent: /ts
  react:
    tool: reactions_add
    with:
      body:
        channel: '{{ sent.conversation }}'
        timestamp: '{{ reply.id }}'
        name: white_check_mark
credentials:
  - kind: secret
    in: security
    name: bot_token
    description: Slack bot token
    instructions: >-
      Find the token in your Slack app's settings at [api.slack.com/apps](https://api.slack.com/apps): choose the app,
      then **OAuth & Permissions**. Under **Bot Token Scopes**, add `channels:read`, `channels:history`, `users:read`,
      `chat:write`, `reactions:read` and `reactions:write`, and `groups:read` and `groups:history` for private
      channels. Select **Install to Workspace** and **Allow**, then copy the token under **OAuth Tokens**. It starts
      with `xoxb-`.
    key_page: https://api.slack.com/apps
    example: xoxb-…
    pattern: ^xoxb-.+$
