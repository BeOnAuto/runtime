name: slack-bot
title: Slack Bot
description: Read channels, conversation history, threads, people and reactions, and post and update messages and add reactions as the bot of a Slack app installed in your workspace, through the Slack Web API.
website: https://docs.slack.dev/apis/web-api/
type: openapi
document: documents/slack.openapi.json
failure_codes:
  succeeded: /ok
  code: /error
  key_refused: [invalid_auth, not_authed, token_revoked, token_expired, account_inactive, not_allowed_token_type]
  scope_lacking: [missing_scope]
  rate_limited: [ratelimited, rate_limited]
renders: slack
conversations:
  tell: all
  automatic: /bot_id
  reply:
    tool: chat_postMessage
    with:
      body:
        channel: '{{ sent.conversation }}'
        thread_ts: '{{ reply.to | default: reply.id | default: sent.id }}'
        text: '{{ message }}'
    sent: /ts
  react:
    tool: reactions_add
    with:
      body:
        channel: '{{ sent.conversation }}'
        timestamp: '{{ reply.id }}'
        name: white_check_mark
events:
  destinations:
    - type: websocket
      open:
        method: POST
        url: https://slack.com/api/apps.connections.open
        address: /url
      credential: app_level_token
      acknowledge: $message.payload#/envelope_id
      filter:
        when:
          '$message.payload#/type': [events_api]
          '$message.payload#/payload/event/type': [message]
        conversation: $message.payload#/payload/event/channel
        automatic: $message.payload#/payload/event/bot_id
      connection:
        account: $message.payload#/payload/team_id
credentials:
  - kind: secret
    in: security
    name: bot_token
    description: Slack bot token
    instructions: >-
      On this connection's page, select **Get a key at api.slack.com**. Slack opens with a new app filled in: choose
      your workspace and select **Create**. If you made the app before, open it at
      [api.slack.com/apps](https://api.slack.com/apps) instead. In the app's settings, select **OAuth & Permissions**,
      then **Install to Workspace** and **Allow**. Under **OAuth Tokens**, copy the token that starts with `xoxb-`. In
      Slack, add the app to each channel your playbooks use: send `/invite @` followed by the app's name.
    key_page: https://api.slack.com/apps?new_app=1&manifest_json=%7B%22display_information%22%3A%7B%22name%22%3A%22Auto%22%7D%2C%22features%22%3A%7B%22bot_user%22%3A%7B%22display_name%22%3A%22Auto%22%7D%7D%2C%22oauth_config%22%3A%7B%22scopes%22%3A%7B%22bot%22%3A%5B%22channels%3Aread%22%2C%22channels%3Ahistory%22%2C%22users%3Aread%22%2C%22chat%3Awrite%22%2C%22reactions%3Aread%22%2C%22reactions%3Awrite%22%2C%22groups%3Aread%22%2C%22groups%3Ahistory%22%5D%7D%7D%2C%22settings%22%3A%7B%22event_subscriptions%22%3A%7B%22bot_events%22%3A%5B%22message.channels%22%2C%22message.groups%22%5D%7D%2C%22socket_mode_enabled%22%3Atrue%7D%7D
    example: xoxb-…
    pattern: ^xoxb-.+$
    test:
      tool: auth_test
    app_credentials:
      - name: app_level_token
        description: Slack app-level token
        instructions: >-
          With it, Slack tells Auto when someone replies to a request. Without it, Auto checks for replies on a timer.
          In the app's settings at Slack, select **Basic Information** and scroll to **App-Level Tokens**. Select
          **Generate Token and Scopes**, enter a name, add the scope `connections:write` and select **Generate**. Copy
          the token. It starts with `xapp-`.
        example: xapp-…
        pattern: ^xapp-.+$
