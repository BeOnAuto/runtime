name: slack-bot
title: Slack Bot
description: Read channels, conversation history, threads, people and reactions, and post and update messages and add reactions as the bot of a Slack app installed in your workspace, through the Slack Web API.
summary: Lets your playbooks read channels and threads and post messages in Slack, as the bot of your own Slack app.
website: https://docs.slack.dev/apis/web-api/
type: openapi
document: documents/slack.openapi.json
failure_codes:
  succeeded: /ok
  code: /error
  key_refused: [invalid_auth, not_authed, token_revoked, token_expired, account_inactive, not_allowed_token_type]
  scope_lacking: [missing_scope]
  rate_limited: [ratelimited, rate_limited]
renders: slack
conversations:
  tell: all
  automatic: /bot_id
  reply:
    tool: chat_postMessage
    with:
      body:
        channel: '{{ sent.conversation }}'
        thread_ts: '{{ reply.to | default: reply.id | default: sent.id }}'
        text: '{{ message }}'
    sent: /ts
  react:
    tool: reactions_add
    with:
      body:
        channel: '{{ sent.conversation }}'
        timestamp: '{{ reply.id }}'
        name: white_check_mark
  typing:
    tool: assistant_threads_setStatus
    with:
      body:
        channel_id: '{{ sent.conversation }}'
        thread_ts: '{{ reply.to }}'
        status: is thinking
        loading_messages:
          - Thinking…
    refused:
      - missing_scope
      - not_allowed_token_type
      - feature_disabled
      - unknown_method
      - method_deprecated
      - deprecated_endpoint
      - access_denied
      - no_permission
      - not_authed
      - invalid_auth
      - token_expired
      - token_revoked
      - account_inactive
      - team_access_not_granted
      - enterprise_is_restricted
      - org_login_required
      - accesslimited
chat:
  answer:
    tool: chat_postMessage
    with:
      body:
        channel: '{{ conversation }}'
        thread_ts: "{% if thread %}{{ thread }}{% elsif kind == 'direct_message' %}{{ omit }}{% else %}{{ id }}{% endif %}"
        markdown_text: '{% if rendered %}{{ omit }}{% else %}{{ message }}{% endif %}'
        text: '{% if rendered %}{{ message }}{% else %}{{ omit }}{% endif %}'
        blocks: '{{ rendered | default: omit }}'
    sent: /ts
    replace:
      tool: chat_update
      with:
        body:
          channel: '{{ conversation }}'
          ts: '{{ sent.id }}'
          markdown_text: '{{ message }}'
  ephemeral:
    tool: chat_postEphemeral
    with:
      body:
        channel: '{{ conversation }}'
        user: '{{ sender }}'
        thread_ts: '{{ thread | default: omit }}'
        text: '{{ message }}'
        blocks: '{{ rendered | default: omit }}'
  thread:
    tool: conversations_replies
    with:
      channel: '{{ conversation }}'
      ts: '{{ thread | default: id }}'
    read:
      list: /messages
      order: oldest_first
      each:
        id: /ts
        sender: /user
        text: /text
        time: /ts
        automatic: /bot_id
  sender:
    tool: users_info
    with:
      user: '{{ sender }}'
    email: /user/profile/email
    email_verified: /user/is_email_confirmed
    account: /user/team_id
    name: /user/real_name
    active:
      /user/deleted: [false, null]
      /user/is_bot: [false, null]
      /user/is_invited_user: [false, null]
      /user/is_stranger: [false, null]
events:
  types:
    - type: com.slack.message
      title: A message is posted
      subject:
        title: Channel
        required: false
        description: >-
          The channel's Slack ID, such as C0123ABCD; the connection's tools give it for a channel's name. Slack reports
          a message only from a channel the app is in, so ask the person to add it there if it is not.
        name:
          tool: conversations_info
          with:
            channel: '{{ subject }}'
          named: /channel/name
          prefix: '#'
      data:
        type: object
        properties:
          text:
            type: string
            description: The words of the message.
          user:
            type: string
            description: The Slack ID of whoever posted the message.
          channel:
            type: string
            description: The Slack ID of the channel the message was posted in.
          ts:
            type: string
            description: The message's timestamp. Slack uses it as the message's ID within its channel.
          thread_ts:
            type: string
            description: The timestamp of the first message of its thread, when the message is a reply in a thread.
  identity:
    tool: auth_test
    identified:
      id: /bot_id
    account: /team_id
    account_name: /team
  destinations:
    - type: websocket
      open:
        method: POST
        url: https://slack.com/api/apps.connections.open
        address: /url
      credential: app_level_token
      acknowledge: $message.payload#/envelope_id
      heartbeat_seconds: 30
      filter:
        when:
          '$message.payload#/type': [events_api]
          '$message.payload#/payload/event/type': [message]
        conversation: $message.payload#/payload/event/channel
        automatic: $message.payload#/payload/event/bot_id
        reply:
          id: $message.payload#/payload/event/ts
          sender: $message.payload#/payload/event/user
          text: $message.payload#/payload/event/text
          to: $message.payload#/payload/event/thread_ts
          time: $message.payload#/payload/event/ts
          changed: $message.payload#/payload/event/hidden
      events:
        - type: com.slack.message
          when:
            '$message.payload#/type': [events_api]
            '$message.payload#/payload/type': [event_callback]
            '$message.payload#/payload/event/type': [message]
            '$message.payload#/payload/event/channel_type': [channel, group]
            '$message.payload#/payload/event/subtype': [null, thread_broadcast, file_share, me_message, bot_message]
          id: ['$message.payload#/payload/event/channel', '$message.payload#/payload/event/ts']
          time: $message.payload#/payload/event/ts
          subject: $message.payload#/payload/event/channel
          data:
            text: $message.payload#/payload/event/text
            user: $message.payload#/payload/event/user
            channel: $message.payload#/payload/event/channel
            ts: $message.payload#/payload/event/ts
            thread_ts: $message.payload#/payload/event/thread_ts
          automatic: $message.payload#/payload/event/bot_id
          changed: $message.payload#/payload/event/hidden
          actor: $message.payload#/payload/event/bot_id
      chat:
        - kind: mention
          when:
            '$message.payload#/type': [events_api]
            '$message.payload#/payload/type': [event_callback]
            '$message.payload#/payload/event/type': [app_mention]
            '$message.payload#/payload/event/subtype': [null]
          id: $message.payload#/payload/event/ts
          conversation: $message.payload#/payload/event/channel
          thread: $message.payload#/payload/event/thread_ts
          sender: $message.payload#/payload/event/user
          account: ['$message.payload#/payload/event/user_team', '$message.payload#/payload/event/team']
          text: $message.payload#/payload/event/text
          time: $message.payload#/payload/event/ts
          automatic: $message.payload#/payload/event/bot_id
          changed: $message.payload#/payload/event/hidden
          shared: $message.payload#/payload/is_ext_shared_channel
          own: ['$message.payload#/payload/event/user', '$message.payload#/payload/authorizations/0/user_id']
        - kind: direct_message
          when:
            '$message.payload#/type': [events_api]
            '$message.payload#/payload/type': [event_callback]
            '$message.payload#/payload/event/type': [message]
            '$message.payload#/payload/event/channel_type': [im]
            '$message.payload#/payload/event/subtype': [null]
          id: $message.payload#/payload/event/ts
          conversation: $message.payload#/payload/event/channel
          thread: $message.payload#/payload/event/thread_ts
          sender: $message.payload#/payload/event/user
          account: ['$message.payload#/payload/event/user_team', '$message.payload#/payload/event/team']
          text: $message.payload#/payload/event/text
          time: $message.payload#/payload/event/ts
          automatic: $message.payload#/payload/event/bot_id
          changed: $message.payload#/payload/event/hidden
          shared: $message.payload#/payload/is_ext_shared_channel
          own: ['$message.payload#/payload/event/user', '$message.payload#/payload/authorizations/0/user_id']
        - kind: ambient
          when:
            '$message.payload#/type': [events_api]
            '$message.payload#/payload/type': [event_callback]
            '$message.payload#/payload/event/type': [message]
            '$message.payload#/payload/event/channel_type': [channel, group]
            '$message.payload#/payload/event/subtype': [null]
          id: $message.payload#/payload/event/ts
          conversation: $message.payload#/payload/event/channel
          thread: $message.payload#/payload/event/thread_ts
          sender: $message.payload#/payload/event/user
          account: ['$message.payload#/payload/event/user_team', '$message.payload#/payload/event/team']
          text: $message.payload#/payload/event/text
          time: $message.payload#/payload/event/ts
          automatic: $message.payload#/payload/event/bot_id
          changed: $message.payload#/payload/event/hidden
          shared: $message.payload#/payload/is_ext_shared_channel
          own: ['$message.payload#/payload/event/user', '$message.payload#/payload/authorizations/0/user_id']
      connection:
        account: $message.payload#/payload/team_id
credentials:
  - kind: secret
    permissions: application
    in: security
    name: bot_token
    description: Slack bot token
    instructions: >-
      On this connection's page, select **Create your Slack app**. Slack opens in a new tab with the app already filled
      in. Leave everything as it is, choose your workspace, then select **Next** and **Create**. If you made the app
      before, open it at [api.slack.com/apps](https://api.slack.com/apps) instead. In Slack, select **OAuth &
      Permissions**, then **Install to Workspace** and **Allow**. Copy the **Bot User OAuth Token**, which starts with
      `xoxb-`, and paste it on this connection's page under **Slack bot token**. Once the connection is connected, add
      the app to each channel your playbooks use: in the channel, type `/invite @Auto` and send it.
    key_page: https://api.slack.com/apps?new_app=1&manifest_json=%7B%22display_information%22%3A%7B%22name%22%3A%22Auto%22%7D%2C%22features%22%3A%7B%22app_home%22%3A%7B%22messages_tab_enabled%22%3Atrue%2C%22messages_tab_read_only_enabled%22%3Afalse%7D%2C%22bot_user%22%3A%7B%22display_name%22%3A%22Auto%22%7D%2C%22agent_view%22%3A%7B%22agent_description%22%3A%22Use%20Auto%20in%20Slack%20to%20build%2C%20run%20and%20inspect%20your%20playbooks.%20To%20answer%20a%20request%20from%20Auto%2C%20reply%20in%20its%20thread.%22%7D%7D%2C%22oauth_config%22%3A%7B%22scopes%22%3A%7B%22bot%22%3A%5B%22channels%3Aread%22%2C%22channels%3Ahistory%22%2C%22users%3Aread%22%2C%22chat%3Awrite%22%2C%22reactions%3Aread%22%2C%22reactions%3Awrite%22%2C%22groups%3Aread%22%2C%22groups%3Ahistory%22%2C%22app_mentions%3Aread%22%2C%22im%3Ahistory%22%2C%22users%3Aread.email%22%2C%22assistant%3Awrite%22%5D%7D%7D%2C%22settings%22%3A%7B%22event_subscriptions%22%3A%7B%22bot_events%22%3A%5B%22message.channels%22%2C%22message.groups%22%2C%22app_mention%22%2C%22message.im%22%5D%7D%2C%22interactivity%22%3A%7B%22is_enabled%22%3Atrue%7D%2C%22socket_mode_enabled%22%3Atrue%7D%7D
    key_page_title: Create your Slack app
    steps:
      key_page:
        title: Create the app in Slack
        instructions: >-
          Slack opens in a new tab with the app already filled in. Leave everything as it is, choose your workspace, then
          select **Next** and **Create**.
      key:
        title: Install the app and copy its token
        instructions: >-
          In Slack, select **OAuth & Permissions**, then **Install to Workspace** and **Allow**. Copy the **Bot User OAuth
          Token** and paste it here.
      connected:
        title: One more thing, in Slack
        instructions: >-
          Add the app to each channel your playbooks use. In the channel, type `/invite @Auto` and send it.
    example: xoxb-…
    pattern: ^xoxb-.+$
    test:
      tool: auth_test
    app_credentials:
      - name: app_level_token
        description: Slack app-level token
        title: Get replies instantly
        instructions: |-
          Auto gets replies the moment they're posted, instead of checking on a timer.

          In Slack, select **Basic Information**, then under **App-Level Tokens** select **Generate Token and Scopes**. Enter any name, add the scope `connections:write`, select **Generate**, then copy the token and paste it here.
        example: xapp-…
        pattern: ^xapp-.+$
