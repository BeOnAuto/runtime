name: notion
title: Notion
description: Search Notion and the sources connected to it, read pages and databases, and create, update, move and comment on them, in the workspace the person who connects chooses, as that person, through Notion's MCP server.
website: https://developers.notion.com/guides/mcp/get-started-with-mcp
type: mcp
url: https://mcp.notion.com/mcp
credentials:
  - kind: authorization
    issuer: https://mcp.notion.com
    scope: default
    clients: [registered, metadata_document, dynamic]
    description: Sign in to Notion, choose a workspace and allow access.
