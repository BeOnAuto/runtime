name: profound
title: Profound
description: Read how your brand appears in AI answers, its visibility, citations, sentiment and prompts, and the traffic AI agents send to your site, through Profound's MCP server.
website: https://docs.tryprofound.com/mcp/overview
type: mcp
url: https://mcp.tryprofound.com/mcp
credentials:
  - kind: authorization
    issuer: https://auth.tryprofound.com
    scope: openid offline_access
    says:
      openid: Read the unique identifier of the Profound account that connects.
      offline_access: Keep access to Profound when nobody is signed in.
    clients: [registered, metadata_document, dynamic]
    description: Sign in to Profound and allow access.
  - kind: secret
    in: header
    name: Authorization
    scheme: Bearer
    description: Profound API key
    instructions: >-
      Make a key in the [Profound platform](https://platform.tryprofound.com/): select your organization's name at the
      top left, then **Settings**, and under **Account**, **API Keys**. In the **Create API Key** banner, name the key,
      choose when it expires and select **Create API Key**. API keys come with Profound's Enterprise plan, and a key
      reaches the data of every organization you belong to. Copy it now: Profound shows it once.
    key_page: https://platform.tryprofound.com/
