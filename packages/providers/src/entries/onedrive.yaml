name: onedrive
title: OneDrive, SharePoint and Excel
description: Search drives, list folders, read file details and list a SharePoint site's drives through Microsoft Graph. Signed in as an account, also read Excel worksheets, ranges and tables and add worksheets and table rows. It fetches no file's bytes, but answers may carry a link that downloads one.
summary: Lets your playbooks find files in OneDrive and SharePoint, and read and add to Excel workbooks.
website: https://learn.microsoft.com/en-us/graph/auth-v2-user
type: openapi
document: documents/onedrive.openapi.json
request_id: request-id
credentials:
  - kind: authorization
    account_types: [service, personal]
    issuer: https://login.microsoftonline.com/organizations/v2.0
    authorization_endpoint: https://login.microsoftonline.com/organizations/oauth2/v2.0/authorize
    token_endpoint: https://login.microsoftonline.com/organizations/oauth2/v2.0/token
    scope: Files.ReadWrite.All Sites.Read.All offline_access
    says:
      Files.ReadWrite.All: Read, create, change and delete all OneDrive and SharePoint files the person who connects can reach.
      Sites.Read.All: Read documents and list items in the SharePoint sites the person who connects can reach.
      offline_access: Keep access to OneDrive and SharePoint when nobody is signed in.
    clients: [registered]
    description: Sign in with your work account and allow access to your files and the SharePoint sites you can read. Your tenant's consent policy may require an administrator to allow Auto once, as Microsoft's default policy for new tenants does for files and sites.
  - kind: client_credentials
    issuer: https://login.microsoftonline.com/{tenant}/v2.0
    scope: https://graph.microsoft.com/.default
    says:
      https://graph.microsoft.com/.default: Act with the Microsoft Graph application permissions an administrator granted to the app.
    placeholders:
      tenant:
        title: Directory (tenant) ID
        description: The ID on the Overview page of the app you registered at Microsoft.
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        example: aaaabbbb-0000-cccc-1111-dddd2222eeee
    key_page: https://go.microsoft.com/fwlink/?linkid=2083908
    key_page_title: Open Microsoft's app registrations
    client_id_title: Application (client) ID
    steps:
      key_page:
        title: Register an app at Microsoft
        instructions: |-
          In Microsoft's app registrations, select **New registration**, name the app, choose **Single tenant only** and select **Register**. Then, on the app's page:

          - Under **API permissions**, select **Add a permission**, **Microsoft Graph** and **Application permissions**. Tick `Files.Read.All` and select **Add permissions**.
          - Select **Grant admin consent** and confirm. This needs the Privileged Role Administrator role.
          - Under **Certificates & secrets**, select **New client secret**, choose when it expires and select **Add**. In the list of secrets, copy the text in the **Value** column, not the **Secret ID** beside it. Microsoft shows the value only once. When it expires, reconnect with a new secret.

          Admin consent lets the app read every file in your organization's OneDrive and SharePoint.
      key:
        title: Enter the app's details here
        instructions: On the app's **Overview** page, copy the **Directory (tenant) ID** and the **Application (client) ID**. Paste them here with the client secret's value.
    limitation: "It can't read or write the cells of an Excel file, and it has no OneDrive of its own: it works in the sites and drives you name."
    description: The ID and secret of an app your company registers with Microsoft.
