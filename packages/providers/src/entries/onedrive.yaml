name: onedrive
title: OneDrive, SharePoint and Excel
description: List and search OneDrive, read file details, list folders, read Excel worksheets, ranges and tables, add worksheets and table rows, and list a SharePoint site's drives, as the person who connects, through Microsoft Graph. It fetches no file's bytes, but answers may carry a link that downloads one.
website: https://learn.microsoft.com/en-us/graph/auth-v2-user
type: openapi
document: documents/onedrive.openapi.json
request_id: request-id
credentials:
  - kind: authorization
    issuer: https://login.microsoftonline.com/organizations/v2.0
    authorization_endpoint: https://login.microsoftonline.com/organizations/oauth2/v2.0/authorize
    token_endpoint: https://login.microsoftonline.com/organizations/oauth2/v2.0/token
    scope: Files.ReadWrite.All Sites.Read.All offline_access
    clients: [registered]
    description: Sign in with your work account and allow access to your files and the SharePoint sites you can read. Your tenant's consent policy may require an administrator to allow Auto once, as Microsoft's default policy for new tenants does for files and sites.
