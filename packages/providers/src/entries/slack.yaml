name: slack
title: Slack
description: Read Slack messages in public and private channels, direct messages and threads, look up people and channels, see reactions, and send and update messages and add reactions, as the person who connects, through the Slack Web API.
website: https://docs.slack.dev/apis/web-api/
type: openapi
document: documents/slack.openapi.json
failure_codes:
  succeeded: /ok
  code: /error
  key_refused: [invalid_auth, not_authed, token_revoked, token_expired, account_inactive]
  scope_lacking: [missing_scope]
  rate_limited: [ratelimited, rate_limited]
credentials:
  - kind: authorization
    issuer: https://mcp.slack.com
    scope: channels:read groups:read im:read mpim:read channels:history groups:history im:history mpim:history users:read reactions:read chat:write reactions:write
    says:
      channels:read: See basic information about public channels in a Slack workspace.
      groups:read: See basic information about private channels the person who connects is in.
      im:read: See basic information about the direct messages of the person who connects.
      mpim:read: See basic information about the group direct messages of the person who connects.
      channels:history: Read messages and other content in Slack public channels.
      groups:history: Read messages and other content in private channels the person who connects is in.
      im:history: Read messages and other content in the direct messages of the person who connects.
      mpim:history: Read messages and other content in the group direct messages of the person who connects.
      users:read: See the people in a Slack workspace.
      reactions:read: See emoji reactions and the content they are on in Slack channels and conversations.
      chat:write: Send Slack messages as the person who connects.
      reactions:write: Add and change emoji reactions in Slack.
    ending_codes: [invalid_refresh_token, token_revoked]
    clients: [registered]
    description: Sign in to Slack and allow access as yourself.
