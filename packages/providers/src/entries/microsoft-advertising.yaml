name: microsoft-advertising
title: Microsoft Advertising
description: Read Microsoft Advertising accounts, campaigns, ad groups, ads, keywords and performance for the accounts you can reach, through Microsoft's Advertising MCP server.
website: https://learn.microsoft.com/en-us/advertising/guides/mcp-setup?view=bingads-13
type: mcp
url: https://partner.api.bingads.microsoft.com/ext/mcp/vnext?toolSetNames=OpenBeta
credentials:
  - kind: authorization
    issuer: https://login.microsoftonline.com/common/v2.0
    authorization_endpoint: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
    token_endpoint: https://login.microsoftonline.com/common/oauth2/v2.0/token
    scope: https://ads.microsoft.com/msads.manage offline_access
    clients: [registered]
    description: Sign in with the Microsoft account you use for Microsoft Advertising and allow access.
