name: x
title: X
description: Read who you are at X, create, edit and delete posts, and read a user's posts, their mentions and the posts of the last seven days a search matches, as yourself, through the X API, under your organization's own OAuth client, which X bills for each call.
website: https://docs.x.com/fundamentals/developer-apps
type: openapi
document: documents/x.openapi.json
request_id: x-transaction-id
credentials:
  - kind: authorization
    issuer: https://api.x.com
    authorization_endpoint: https://x.com/i/oauth2/authorize
    token_endpoint: https://api.x.com/2/oauth2/token
    revocation_endpoint: https://api.x.com/2/oauth2/revoke
    scope: tweet.read tweet.write users.read offline.access
    says:
      tweet.read: Read every post the X account can see, those of protected accounts among them.
      tweet.write: Create, edit, repost and delete posts as the X account that connects.
      users.read: Read the profiles of every account the X account can see, protected accounts among them.
      offline.access: Keep access to X when nobody is signed in.
    oauth_client: required
    description: Sign in to X and allow posting as you, under your organization's own OAuth client.
