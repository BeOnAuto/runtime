name: google-drive
title: Google Drive
description: Search, list, read and download Google Drive files and their metadata and sharing, through Google's Drive MCP server. By default it reaches the files opened with Auto or created by it, and creates and copies files; its second way reads every file, through drive.readonly, which Google restricts.
website: https://developers.google.com/workspace/drive/api/guides/configure-mcp-server
type: mcp
url: https://drivemcp.googleapis.com/mcp/v1
credentials:
  - kind: authorization
    issuer: https://accounts.google.com
    scope: https://www.googleapis.com/auth/drive.file
    says:
      https://www.googleapis.com/auth/drive.file: See, change, create and delete only the Google Drive files opened or created through this connection.
    parameters:
      access_type: offline
      prompt: consent
    clients: [registered]
    description: Sign in to Google and allow Google Drive.
  - kind: authorization
    issuer: https://accounts.google.com
    scope: https://www.googleapis.com/auth/drive.readonly
    says:
      https://www.googleapis.com/auth/drive.readonly: See and download every file of the person's Google Drive.
    parameters:
      access_type: offline
      prompt: consent
    clients: [registered]
    description: Sign in to Google and allow all of Google Drive to be read.
