name: google-drive
title: Google Drive
description: Search and list Google Drive files, read their metadata and sharing, export Docs, Sheets and Slides files as text, and create empty files and copy files. The first way reaches only files Auto creates; the second reads every file, through drive.readonly, which Google restricts, and creates none.
website: https://developers.google.com/workspace/drive/api/reference/rest/v3
type: openapi
document: documents/google-drive.openapi.json
credentials:
  - kind: authorization
    issuer: https://accounts.google.com
    scope: https://www.googleapis.com/auth/drive.file
    says:
      https://www.googleapis.com/auth/drive.file: See, change, create and delete only the Google Drive files opened or created through this connection.
    parameters:
      access_type: offline
      prompt: consent
    clients: [registered]
    description: Sign in to Google and allow Google Drive.
  - kind: authorization
    issuer: https://accounts.google.com
    scope: https://www.googleapis.com/auth/drive.readonly
    says:
      https://www.googleapis.com/auth/drive.readonly: See and download every file of the person's Google Drive.
    parameters:
      access_type: offline
      prompt: consent
    clients: [registered]
    description: Sign in to Google and allow all of Google Drive to be read.
