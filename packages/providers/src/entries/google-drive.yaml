name: google-drive
title: Google Drive
description: Search and list the Google Drive files the person opens with Auto or Auto creates, not all of their Drive, read their metadata, sharing and content, download them, and create and copy files, through Google's Drive MCP server.
website: https://developers.google.com/workspace/drive/api/guides/configure-mcp-server
type: mcp
url: https://drivemcp.googleapis.com/mcp/v1
credentials:
  - kind: authorization
    issuer: https://accounts.google.com
    scope: https://www.googleapis.com/auth/drive.file
    says:
      https://www.googleapis.com/auth/drive.file: See, change, create and delete only the Google Drive files opened or created through this connection.
    parameters:
      access_type: offline
      prompt: consent
    clients: [registered]
    description: Sign in to Google and allow Google Drive.
