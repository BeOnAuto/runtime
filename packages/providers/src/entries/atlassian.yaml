name: atlassian
title: Atlassian
description: Search and read Jira work items and Confluence pages, and create, update and comment on them, through Atlassian's MCP server, as the person or the service account that connects and with its permissions.
summary: Lets your playbooks search, read, create and update Jira work items and Confluence pages.
website: https://support.atlassian.com/atlassian-ai-gateway/docs/get-started-with-the-atlassian-remote-mcp-server/
type: mcp
url: https://mcp.atlassian.com/v2/mcp?tools=all
credentials:
  - kind: authorization
    account_types: [personal]
    issuer: https://auth.atlassian.com/VCeDsk8ZHncYF1g234fKtc4lNipbBhu3
    scope: read:me read:account email offline_access read:jira:agent-interface search:jira:agent-interface read:confluence:agent-interface search:confluence:agent-interface write:jira:agent-interface write:confluence:agent-interface
    says:
      read:me: Read the Atlassian profile of the person who connects.
      read:account: Read the profiles of Atlassian users.
      email: Read the email address of the Atlassian account that connects.
      offline_access: Keep access to Jira and Confluence when nobody is signed in.
      read:jira:agent-interface: Read Jira work items, projects, boards, sprints, comments, worklogs and attachments.
      search:jira:agent-interface: Search Jira work items with JQL.
      read:confluence:agent-interface: Read Confluence pages, spaces, comments, attachments and versions.
      search:confluence:agent-interface: Search Confluence content with CQL.
      write:jira:agent-interface: Create and change Jira work items, comments, worklogs, links, versions, sprints and boards.
      write:confluence:agent-interface: Create, change, move and archive Confluence pages, spaces, comments, labels and permissions.
    clients: [registered, metadata_document, dynamic]
    description: Sign in to Atlassian, choose a site and allow Jira and Confluence.
  - kind: secret
    account_types: [service]
    in: header
    name: Authorization
    scheme: Bearer
    description: API token
    instructions: >-
      In [Atlassian Administration](https://admin.atlassian.com), an organization admin turns on **Allow API token
      authentication** for the Atlassian MCP server, creates a service account, and creates an API token for it with
      the scopes for Jira and Confluence. Paste that token on this connection's page. Atlassian lets a token last a year
      at most.
    key_page: https://admin.atlassian.com
    key_page_title: Open Atlassian Administration
    steps:
      key_page:
        title: Allow API tokens for Atlassian's MCP server
        instructions: |-
          - Select **Connectors**, then **Atlassian MCP server**.
          - In the **Authentication** tab, turn **Allow API token authentication** on.

          This page needs an organization admin at Atlassian.
      pages:
        - title: Create a service account
          instructions: |-
            - In Atlassian Administration, select **Directory**, then **Service accounts**.
            - Select **Create a service account** and name it.
            - Select roles for the apps it needs to reach, Jira and Confluence, then select **Create**.
          page: https://admin.atlassian.com
          page_title: Open Atlassian Administration
        - title: Create its API token
          instructions: |-
            - Open the service account and select **Create credentials**.
            - Select **API token**, then **Next**.
            - Name the token and select an expiration date. Atlassian allows a year at most. When the token ends, reconnect with a new one.
            - Select the scopes for Jira and Confluence, then **Create**.
            - Select **Copy to clipboard**. Atlassian shows the token once.
          page: https://admin.atlassian.com
          page_title: Open Atlassian Administration
      key:
        title: Paste the API token here
        instructions: Paste the API token you copied from Atlassian.
    limitation: It can't use some of Atlassian's tools, such as some for Compass.
