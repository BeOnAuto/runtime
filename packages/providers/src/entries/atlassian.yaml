name: atlassian
title: Atlassian
description: Search and read Jira work items and Confluence pages, and create, update and comment on them, through Atlassian's MCP server, as the person who connects and with their permissions.
website: https://support.atlassian.com/atlassian-ai-gateway/docs/get-started-with-the-atlassian-remote-mcp-server/
type: mcp
url: https://mcp.atlassian.com/v2/mcp?tools=all
credentials:
  - kind: authorization
    issuer: https://auth.atlassian.com/VCeDsk8ZHncYF1g234fKtc4lNipbBhu3
    scope: read:me read:account email offline_access read:jira:agent-interface search:jira:agent-interface read:confluence:agent-interface search:confluence:agent-interface write:jira:agent-interface write:confluence:agent-interface
    says:
      read:me: Read the Atlassian profile of the person who connects.
      read:account: Read the profiles of Atlassian users.
      email: Read the email address of the Atlassian account that connects.
      offline_access: Keep access to Jira and Confluence when nobody is signed in.
      read:jira:agent-interface: Read Jira work items, projects, boards, sprints, comments, worklogs and attachments.
      search:jira:agent-interface: Search Jira work items with JQL.
      read:confluence:agent-interface: Read Confluence pages, spaces, comments, attachments and versions.
      search:confluence:agent-interface: Search Confluence content with CQL.
      write:jira:agent-interface: Create and change Jira work items, comments, worklogs, links, versions, sprints and boards.
      write:confluence:agent-interface: Create, change, move and archive Confluence pages, spaces, comments, labels and permissions.
    clients: [registered, metadata_document, dynamic]
    description: Sign in to Atlassian, choose a site and allow Jira and Confluence.
