name: youtube-management
title: YouTube management
description: Read the comments on a YouTube channel's videos and their replies, and update a video's title, description, tags, category, language, privacy, publish time, licence, embedding, audience, synthetic media label, recording date and translations, clearing what a call leaves out of a part it sends.
summary: Lets your playbooks read comments on a channel's videos and update video details.
website: https://developers.google.com/youtube/v3
icons:
  - src: icons/youtube.svg
type: openapi
document: documents/youtube-management.openapi.json
credentials:
  - kind: authorization
    account_types: [personal]
    issuer: https://accounts.google.com
    scope: https://www.googleapis.com/auth/youtube.force-ssl
    says:
      https://www.googleapis.com/auth/youtube.force-ssl: See, change and permanently delete YouTube videos, ratings, comments and captions.
    parameters:
      access_type: offline
      prompt: consent
    clients: [registered]
    key_page: https://console.developers.google.com/auth/clients
    key_page_title: Open Google Auth Platform's clients
    steps:
      key_page:
        title: Create an OAuth client at Google
        instructions: |-
          - Use a project where the **YouTube Data API v3** is turned on.
          - If you see **Google Auth platform not configured yet**, select **Get Started** and follow its steps. Under **Audience**, select **Internal**, so that only members of your organization can sign in.
          - Select **Create client**. In **Application type**, select **Web application**.
          - Under **Authorized redirect URIs**, select **Add URI** and add the redirect URL below.
          - Select **Create**. Copy the client ID and the client secret now: Google shows the full secret only once. You enter both in step 2.

          If the account that manages the channel is outside your organization, select **External** and publish the app. While the app is in **Testing**, Google ends each sign-in after seven days.
    description: Sign in to Google and allow YouTube management.
