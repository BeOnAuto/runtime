name: adobe-analytics
title: Adobe Analytics
description: Run Adobe Analytics reports and top-item reports, read report suites, dimensions, metrics, segments, calculated metrics, date ranges and projects, and create segments, through the Analytics 2.0 API.
summary: Lets your playbooks run Adobe Analytics reports and read and create segments.
website: https://developer.adobe.com/analytics-apis/docs/2.0/
type: openapi
document: documents/adobe-analytics.openapi.json
base_url: https://analytics.adobe.io/api/{global_company_id}
headers:
  x-api-key: '{client_id}'
marks:
  reads:
    - runReport
placeholders:
  global_company_id:
    title: Global company ID
    description: The ID Adobe Analytics shows under Admin, All admin, Company settings, API Access.
    pattern: '^[A-Za-z0-9]{1,64}$'
    example: testco0
credentials:
  - kind: client_credentials
    issuer: https://ims-na1.adobelogin.com
    scope: openid session AdobeID read_organizations additional_info.projectedProductContext
    says:
      openid: Read the unique identifier of the Adobe account the connection signs in as.
      session: Keep a session at Adobe IMS for the technical account of the credential.
      AdobeID: Act as the Adobe ID of the account in calls to Adobe APIs.
      read_organizations: Read the Adobe organizations the account belongs to.
      additional_info.projectedProductContext: Read the Adobe product profiles and Adobe Analytics permissions of the account.
    description: The client id and secret of a Server-to-Server credential of an Adobe Developer Console project with the Adobe Analytics API.
  - kind: authorization
    account_types: [personal]
    issuer: https://ims-na1.adobelogin.com
    scope: openid AdobeID read_organizations additional_info.projectedProductContext additional_info.job_function offline_access
    says:
      openid: Read the unique identifier of the Adobe account the connection signs in as.
      AdobeID: Act as the Adobe ID of the account in calls to Adobe APIs.
      read_organizations: Read the Adobe organizations the account belongs to.
      additional_info.projectedProductContext: Read the Adobe product profiles and Adobe Analytics permissions of the account.
      additional_info.job_function: Read the job function in the Adobe profile of the account.
      offline_access: Keep access to Adobe Analytics when nobody is signed in.
    clients: [registered]
    key_page: https://console.adobe.io
    key_page_title: Open Adobe Developer Console
    steps:
      key_page:
        title: Create a credential at Adobe
        instructions: |-
          - Select **Create new project**, then **Add API**.
          - Select **Adobe Analytics**, then **Next**.
          - Choose **OAuth User**, with an **OAuth Web App credential**.
          - Enter the redirect URL below as the **Default redirect URI**.
    description: Sign in with your Adobe ID and allow Adobe Analytics.
