name: adobe-analytics
title: Adobe Analytics
description: Run Adobe Analytics reports and top-item reports, read report suites, dimensions, metrics, segments, calculated metrics, date ranges and projects, and create segments, through the Analytics 2.0 API.
website: https://developer.adobe.com/analytics-apis/docs/2.0/
type: openapi
document: documents/adobe-analytics.openapi.json
base_url: https://analytics.adobe.io/api/{global_company_id}
headers:
  x-api-key: '{client_id}'
placeholders:
  global_company_id:
    description: Your global company ID, which https://analytics.adobe.io/discovery/me answers.
    pattern: '^[A-Za-z0-9]{1,64}$'
    example: testco0
credentials:
  - kind: client_credentials
    issuer: https://ims-na1.adobelogin.com
    scope: openid session AdobeID read_organizations additional_info.projectedProductContext
    description: The client id and secret of a Server-to-Server credential of an Adobe Developer Console project with the Adobe Analytics API.
  - kind: authorization
    issuer: https://ims-na1.adobelogin.com
    scope: openid AdobeID read_organizations additional_info.projectedProductContext additional_info.job_function offline_access
    clients: [registered]
    description: Sign in with your Adobe ID and allow Adobe Analytics.
