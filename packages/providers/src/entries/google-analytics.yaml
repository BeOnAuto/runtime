name: google-analytics
title: Google Analytics
description: Run Google Analytics 4 reports, pivot, batch and realtime reports, check which dimensions and metrics go together, read a property's metadata, and create and read audience exports, for any property you can read.
website: https://developers.google.com/analytics/devguides/reporting/data/v1
type: openapi
document: documents/google-analytics.openapi.json
credentials:
  - kind: authorization
    issuer: https://accounts.google.com
    scope: https://www.googleapis.com/auth/analytics.readonly
    parameters:
      access_type: offline
      prompt: consent
    clients: [registered]
    description: Sign in to Google and allow Google Analytics reporting.
