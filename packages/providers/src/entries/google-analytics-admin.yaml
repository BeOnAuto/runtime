name: google-analytics-admin
title: Google Analytics Admin
description: Read Google Analytics accounts, properties, data streams, custom dimensions, custom metrics and key events, and run data access reports.
summary: Lets your playbooks read how your Google Analytics accounts and properties are set up.
website: https://developers.google.com/analytics/devguides/config/admin/v1
type: openapi
document: documents/google-analytics-admin.openapi.json
marks:
  reads:
    - analyticsadmin.properties.runAccessReport
credentials:
  - kind: authorization
    account_types: [personal]
    issuer: https://accounts.google.com
    scope: https://www.googleapis.com/auth/analytics.readonly
    says:
      https://www.googleapis.com/auth/analytics.readonly: See and download Google Analytics data.
    parameters:
      access_type: offline
      prompt: consent
    clients: [registered]
    description: Sign in to Google and allow Google Analytics administration.
  - kind: jwt_bearer
    issuer: https://accounts.google.com
    scope: https://www.googleapis.com/auth/analytics.readonly
    says:
      https://www.googleapis.com/auth/analytics.readonly: See and download Google Analytics data.
    key_file:
      client_id: /client_email
      private_key: /private_key
    key_page: https://console.cloud.google.com/iam-admin/serviceaccounts
    key_page_title: Open Google Cloud's service accounts
    steps:
      key_page:
        title: Create a service account at Google
        instructions: |-
          - Create a service account in a project where the **Google Analytics Admin API** is turned on.
          - Open the service account. On the **Keys** tab, select **Add key**, then **Create new key**. Choose **JSON** as the **Key type** and select **Create**. Google downloads the key as a file. It is the only copy.
          - Copy the service account's email address. You need it in the next step.

          If Google does not let you create a key, your organization has turned key creation off. Ask whoever manages Google Cloud at your company.
      pages:
        - title: Add it as a user in Google Analytics
          page: https://analytics.google.com/
          page_title: Open Google Analytics
          instructions: |-
            - In **Admin**, under **Account** or **Property**, select **Access Management**.
            - Select **+**, then **Add users**.
            - Enter the service account's email address and select the permissions you want. This connection only reads.
            - Select **Add**.

            This step needs an administrator of the Analytics account or property.
      key:
        title: Enter the details here
        instructions: Choose the key file Google downloaded.
    description: Connect as a service account your company creates at Google.
