name: buffer
title: Buffer
description: Read the channels, posts, ideas and post metrics of every Buffer organization the person who connects belongs to, and schedule or publish posts and save ideas, as that person, through Buffer's MCP server. It connects with an API key, since Buffer's sign-in takes the apps Buffer lists alone.
website: https://developers.buffer.com/guides/integrations/mcp.html
type: mcp
url: https://mcp.buffer.com/mcp
credentials:
  - kind: secret
    in: header
    name: Authorization
    scheme: Bearer
    description: Buffer API key
    instructions: >-
      Make a key in Buffer at [Settings, API](https://publish.buffer.com/settings/api): open the **Personal Access**
      tab, select **+ New Key** under **Keys**, name the key, leave every permission ticked, choose when it expires and
      select **Generate API Key**. Only the owner of a Buffer organization can make one, and the key reaches your whole
      Buffer account. Copy it when Buffer shows it.
    key_page: https://publish.buffer.com/settings/api
