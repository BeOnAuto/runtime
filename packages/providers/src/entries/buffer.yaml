name: buffer
title: Buffer
description: Read the channels, posts, ideas and post metrics of every Buffer organization the person who connects belongs to, and schedule or publish posts and save ideas, as that person, through Buffer's MCP server. It connects with an API key, since Buffer's sign-in takes the apps Buffer lists alone.
website: https://developers.buffer.com/guides/integrations/mcp.html
type: mcp
url: https://mcp.buffer.com/mcp
credentials:
  - kind: secret
    in: header
    name: Authorization
    scheme: Bearer
    description: A Buffer API key, made at Buffer under Settings, API, which reaches your whole Buffer account.
