name: buffer
title: Buffer
description: Read the channels, posts, ideas and post metrics of every Buffer organization the person who connects belongs to, and schedule or publish posts and save ideas, as that person, through Buffer's MCP server. It connects with an API key, since Buffer's sign-in takes the apps Buffer lists alone.
summary: Lets your playbooks read channels and posts in Buffer, and schedule or publish posts.
website: https://developers.buffer.com/guides/integrations/mcp.html
icons:
  - src: icons/buffer.svg
    theme: light
  - src: icons/buffer-dark.svg
    theme: dark
type: mcp
url: https://mcp.buffer.com/mcp
credentials:
  - kind: secret
    account_types: [service, personal]
    in: header
    name: Authorization
    scheme: Bearer
    description: Buffer API key
    instructions: |-
      - Sign in to Buffer as the account the key belongs to. For a service account, that is the account your company added to its Buffer organization.
      - In [Settings, API](https://publish.buffer.com/settings/api), open the **Personal Access** tab and select **+ New Key** under **Keys**.
      - Name the key and leave every permission ticked.
      - Choose when it expires. Buffer allows a year at most. When the key ends, reconnect with a new one.
      - Select **Generate API Key** and copy the key.

      The key reaches the Buffer organizations that account has access to.
    key_page: https://publish.buffer.com/settings/api
    key_page_title: Open Buffer's API settings
