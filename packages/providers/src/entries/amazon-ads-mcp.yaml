name: amazon-ads-mcp
title: Amazon Ads MCP
description: Read and manage Amazon Ads campaigns, ad groups, ads, targets and reports through Amazon's Ads MCP server, in the region of your advertiser account.
summary: Lets your playbooks read and manage Amazon Ads campaigns, ad groups, ads, targets and reports.
website: https://advertising.amazon.com/API/docs/en-us/mcp/get-started
type: mcp
url: https://{mcp_host}/mcp
headers:
  Amazon-Ads-ClientId: '{client_id}'
placeholders:
  region:
    title: Region
    description: The region your Amazon Ads account advertises in.
    choices:
      - value: na
        title: North America
        sets:
          mcp_host: advertising-ai.amazon.com
      - value: eu
        title: Europe
        sets:
          mcp_host: advertising-ai-eu.amazon.com
      - value: fe
        title: Far East
        sets:
          mcp_host: advertising-ai-fe.amazon.com
credentials:
  - kind: authorization
    account_types: [service, personal]
    issuer: https://lwa.amazon.com
    scope: advertising::campaign_management
    says:
      advertising::campaign_management: Read and manage the campaigns, ad groups, ads, targets and reports of Amazon Ads advertiser accounts.
    clients: [registered]
    key_page: https://developer.amazon.com/loginwithamazon/console/site/lwa/overview.html
    key_page_title: Open Amazon's developer console
    steps:
      key_page:
        title: Create an app at Amazon
        instructions: |-
          - Under **Login with Amazon**, select **Create a New Security Profile**.
          - Under **Web Settings**, select **Edit** and add the redirect URL below to **Allowed Return URLs**.
          - Select **Show Client ID and Client Secret**. You enter both in step 3.
      pages:
        - title: Ask Amazon for access to its Ads API
          instructions: |-
            - Apply as a **Direct Advertiser**, signed in with the Amazon account that created the app.
            - Amazon reviews the request. This can take up to a business day.
            - When Amazon approves it, assign the access to the app.

            You can close this page and come back when Amazon has approved it.
          page: https://advertising.amazon.com/partner-network/register-api
          page_title: Open Amazon's request form
    description: Sign in with Amazon and allow Amazon Ads campaign management.
