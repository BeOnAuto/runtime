name: google-slides
title: Google Slides
description: Read Google Slides presentations and update them.
website: https://developers.google.com/workspace/slides/api/reference/rest
type: openapi
document: documents/google-slides.openapi.json
credentials:
  - kind: authorization
    issuer: https://accounts.google.com
    scope: https://www.googleapis.com/auth/presentations.readonly https://www.googleapis.com/auth/presentations
    says:
      https://www.googleapis.com/auth/presentations.readonly: See all Google Slides presentations.
      https://www.googleapis.com/auth/presentations: See, change, create and delete all Google Slides presentations.
    parameters:
      access_type: offline
      prompt: consent
    clients: [registered]
    description: Sign in to Google and allow Google Slides.
