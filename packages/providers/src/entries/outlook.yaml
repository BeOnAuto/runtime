name: outlook
title: Outlook
description: List, search and read Outlook mail and mail folders, send mail, reply and make drafts, and read the calendar between two dates and read, create, update and cancel events, as the person who connects, through Microsoft Graph.
website: https://learn.microsoft.com/en-us/graph/auth-v2-user
type: openapi
document: documents/outlook.openapi.json
request_id: request-id
credentials:
  - kind: authorization
    issuer: https://login.microsoftonline.com/organizations/v2.0
    authorization_endpoint: https://login.microsoftonline.com/organizations/oauth2/v2.0/authorize
    token_endpoint: https://login.microsoftonline.com/organizations/oauth2/v2.0/token
    scope: Mail.ReadWrite Mail.Send Calendars.ReadWrite User.Read offline_access
    clients: [registered]
    description: Sign in with your work account and allow access to your mail and calendar. Your tenant's consent policy may require an administrator to allow Auto once, as Microsoft's default policy for new tenants does for mail and calendar.
