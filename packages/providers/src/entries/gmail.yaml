name: gmail
title: Gmail
description: Search and read Gmail threads and their messages, and list drafts and labels, through Google's Gmail MCP server. It drafts, labels and sends no mail, since it asks the scope that reads alone. Google classifies its scope, gmail.readonly, as restricted.
website: https://developers.google.com/workspace/gmail/api/guides/configure-mcp-server
type: mcp
url: https://gmailmcp.googleapis.com/mcp/v1
credentials:
  - kind: authorization
    issuer: https://accounts.google.com
    scope: https://www.googleapis.com/auth/gmail.readonly
    says:
      https://www.googleapis.com/auth/gmail.readonly: Read Gmail messages, threads, drafts, labels and settings.
    parameters:
      access_type: offline
      prompt: consent
    clients: [registered]
    description: Sign in to Google and allow Gmail.
