name: google-search-console
title: Google Search Console
description: Query search clicks, impressions, click-through rates and positions for your Search Console properties, inspect how Google indexes a URL, list sitemaps, and add or remove properties. It reaches domain properties, named sc-domain:example.com.
website: https://developers.google.com/webmaster-tools
type: openapi
document: documents/google-search-console.openapi.json
credentials:
  - kind: authorization
    issuer: https://accounts.google.com
    scope: https://www.googleapis.com/auth/webmasters
    parameters:
      access_type: offline
      prompt: consent
    clients: [registered]
    description: Sign in to Google and allow Search Console.
