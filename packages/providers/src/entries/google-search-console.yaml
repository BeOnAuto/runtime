name: google-search-console
title: Google Search Console
description: Query clicks, impressions, click-through rates and positions, inspect how Google indexes a URL, list sitemaps, and add or remove properties. It reaches domain properties, named sc-domain:example.com, and URL-prefix properties, named with their scheme and trailing slash, https://www.example.com/.
summary: Lets your playbooks read search performance, inspect URLs and manage properties in Google Search Console.
website: https://developers.google.com/webmaster-tools
type: openapi
document: documents/google-search-console.openapi.json
marks:
  reads:
    - webmasters.searchanalytics.query
    - searchconsole.urlInspection.index.inspect
credentials:
  - kind: authorization
    account_types: [personal]
    issuer: https://accounts.google.com
    scope: https://www.googleapis.com/auth/webmasters
    says:
      https://www.googleapis.com/auth/webmasters: Read and manage Search Console data of verified sites.
    parameters:
      access_type: offline
      prompt: consent
    clients: [registered]
    description: Sign in to Google and allow Search Console.
  - kind: token_exchange
    managed_service_account: true
    token_endpoint: https://sts.googleapis.com/v1/token
    audience: //iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/auto/providers/auto
    subject_token:
      type: urn:ietf:params:oauth:token-type:jwt
      audience: https://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/auto/providers/auto
    parameters:
      requested_token_type: urn:ietf:params:oauth:token-type:access_token
      scope: https://www.googleapis.com/auth/cloud-platform
    impersonation:
      method: POST
      url: https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/{service_account_email}:generateAccessToken
      request:
        scope: /scope
      issued:
        access_token: /accessToken
        expires_at: /expireTime
    scope: https://www.googleapis.com/auth/webmasters
    says:
      https://www.googleapis.com/auth/webmasters: Read and manage Search Console data of verified sites.
    placeholders:
      project_number:
        title: Project number
        description: Digits only. Google Cloud shows it on the project's Dashboard, under Project info.
        pattern: '^[0-9]+$'
        example: '123456789012'
      service_account_email:
        title: Service account email
        description: The email address of the service account you created in step 1.
        pattern: '^[^@\s/?#:]+@[^@\s/?#:]+$'
        example: auto@acme-analytics.iam.gserviceaccount.com
    test:
      tool: webmasters.sites.list
      reached:
        list: /siteEntry
        name: /siteUrl
    steps:
      pages:
        - title: Add it as a user in Search Console
          page: https://search.google.com/search-console
          page_title: Open Search Console
          instructions: |-
            - Open the property in Search Console.
            - Under **Settings**, open **Users and permissions**.
            - Select **Add user**, enter the service account's email address and choose a permission.

            This step needs an owner of the property.
    description: Connect as a service account that Auto manages. An Admin adds its email address in the app.
  - kind: token_exchange
    token_endpoint: https://sts.googleapis.com/v1/token
    audience: //iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/auto/providers/auto
    subject_token:
      type: urn:ietf:params:oauth:token-type:jwt
      audience: https://iam.googleapis.com/projects/{project_number}/locations/global/workloadIdentityPools/auto/providers/auto
    parameters:
      requested_token_type: urn:ietf:params:oauth:token-type:access_token
      scope: https://www.googleapis.com/auth/cloud-platform
    impersonation:
      method: POST
      url: https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/{service_account_email}:generateAccessToken
      request:
        scope: /scope
      issued:
        access_token: /accessToken
        expires_at: /expireTime
    scope: https://www.googleapis.com/auth/webmasters
    says:
      https://www.googleapis.com/auth/webmasters: Read and manage Search Console data of verified sites.
    placeholders:
      project_number:
        title: Project number
        description: Digits only. Google Cloud shows it on the project's Dashboard, under Project info.
        pattern: '^[0-9]+$'
        example: '123456789012'
      service_account_email:
        title: Service account email
        description: The email address of the service account you created in step 1.
        pattern: '^[^@\s/?#:]+@[^@\s/?#:]+$'
        example: auto@acme-analytics.iam.gserviceaccount.com
    test:
      tool: webmasters.sites.list
      reached:
        list: /siteEntry
        name: /siteUrl
    key_page: https://console.cloud.google.com/iam-admin/serviceaccounts
    key_page_title: Open Google Cloud's service accounts
    steps:
      key_page:
        title: Create a service account at Google
        instructions: |-
          - Create a service account in a project where the **Google Search Console API** is turned on.
          - In the same project, [turn on](https://console.cloud.google.com/apis/enableflow?apiid=sts.googleapis.com,iamcredentials.googleapis.com) the **Security Token Service API** and the **IAM Service Account Credentials API**.
          - Copy the service account's email address. You need it in steps 3, 4 and 5.

          Steps 1 to 3 need whoever manages Google Cloud at your company, with the roles **Workload Identity Pool Admin** and **Service Account Admin** on that project. No key is created.
      pages:
        - title: Create an identity pool at Google
          page: https://console.cloud.google.com/iam-admin/workload-identity-pools
          page_title: Open Google Cloud's identity pools
          instructions: |-
            - Under **Create an identity pool**, enter `auto` in **Name** and select **Continue**.
            - In **Select a provider**, choose **OpenID Connect (OIDC)**. Enter `auto` in **Provider name**.
            - In **Issuer URL**, paste this address: {issuer}
            - Select **Continue**. Under **Configure provider attributes**, map `google.subject` to `assertion.sub`. Select **Save**.

            If you already did this for another Google app in the same project, skip this step.
        - title: Grant access to the service account
          page: https://console.cloud.google.com/iam-admin/workload-identity-pools
          page_title: Open Google Cloud's identity pools
          instructions: |-
            - Open the pool `auto` and select **Grant access**, then **Grant access using Service Account impersonation**.
            - Select the service account you created in step 1.
            - Select **Only identities matching the filter**. In **Attribute name**, choose **subject**. In **Attribute value**, paste this: {subject}
            - Select **Save**, then **Dismiss**.

            Only your organization in Auto can then act as this service account. Don't give access to the whole pool, since every organization in Auto can use it.
        - title: Add it as a user in Search Console
          page: https://search.google.com/search-console
          page_title: Open Search Console
          instructions: |-
            - Open the property in Search Console.
            - Under **Settings**, open **Users and permissions**.
            - Select **Add user**, enter the service account's email address and choose a permission.

            This step needs an owner of the property.
      key:
        title: Enter the details here
        instructions: |-
          Enter the project number and the email address of the service account from step 1.

          If Connect is refused at first, wait a few minutes and select Connect again: Google can take that long to apply the access you granted in step 3.
    description: Connect as a service account your company creates at Google.
