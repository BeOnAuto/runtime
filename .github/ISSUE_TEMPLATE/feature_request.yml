name: Feature request
description: An idea for a workflow, function or other improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do with a playbook, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you picture it working. Name the workflow, function or capability it touches if you know it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried instead
