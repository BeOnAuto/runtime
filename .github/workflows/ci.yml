name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  CI: '1'
  UNCACHED: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}

concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Restore the tasks turbo cached on the last run of this job under the same lockfile and turbo configuration
        id: turbo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-verify-${{ hashFiles('pnpm-lock.yaml', '**/turbo.json') }}-${{ github.sha }}
          restore-keys: turbo-verify-${{ hashFiles('pnpm-lock.yaml', '**/turbo.json') }}-
      - run: |
          pnpm install --frozen-lockfile
          node scripts/cache-platform.ts
      - name: Check the format, the lint rules and the types, and run knip and sherif, from no cache outside a pull request
        run: |
          uncached=()
          if [ "$UNCACHED" = true ]; then
            uncached=(--force)
          fi
          pnpm exec turbo run format:check lint typecheck knip sherif "${uncached[@]}"
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_RUN_SUMMARY: true
      - name: Check the documentation
        run: pnpm docs:check
      - name: Show the inputs of turbo's global hash and, for each task, its hash, its cache status and its time
        if: ${{ !cancelled() }}
        run: .github/turbo/show-run-summary.sh
      - name: Keep in turbo's cache only the tasks of this run, so the cache it saves holds one run and does not grow
        if: ${{ !cancelled() && steps.turbo-cache.outputs.cache-hit != 'true' }}
        run: .github/turbo/keep-only-this-run.sh
      - name: Save turbo's cache for the next run of this job
        if: ${{ !cancelled() && steps.turbo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

  test:
    name: Test (${{ join(matrix.packages, ', ') }}${{ matrix.shard && format(', shard {0} of {1}', matrix.shard.index, matrix.shard.count) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - packages: [server]
            shard: { index: 1, count: 4 }
            services: true
          - packages: [server]
            shard: { index: 2, count: 4 }
            services: true
          - packages: [server]
            shard: { index: 3, count: 4 }
            services: true
          - packages: [server]
            shard: { index: 4, count: 4 }
            services: true
          - packages:
              [ledger, meter, workflow-host, prediction, object-storage, workflow-engine, generation, openid-connect]
            services: true
          - packages:
              - activity
              - coordination
              - definitions
              - operations
            services: false
          - packages:
              - api
              - identity
              - interaction
              - providers
              - reasoning
              - secrets
            services: false
          - packages:
              - access-control
              - computation
              - config
              - connections
              - content
              - documents
              - goals
              - json-schema
              - lookup
              - node-sqlite
              - outbound
              - phrasing
              - playbooks
              - shipped-files
              - tool-servers
            services: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Start PostgreSQL and the object store, after the runner is hardened, so no restart of Docker stops them
        if: matrix.services
        run: |
          docker run --detach --name postgresql --publish 5432:5432 --env POSTGRES_PASSWORD=ledger-ci \
            postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          docker run --detach --name object-store --publish 9000:9000 \
            --env RUSTFS_ACCESS_KEY=content-ci --env RUSTFS_SECRET_KEY=content-ci-secret \
            rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Restore the tasks turbo cached on the last run of this group under the same lockfile and turbo configuration
        id: turbo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-test-${{ join(matrix.packages, '-') }}${{ matrix.shard && format('-shard-{0}', matrix.shard.index) || '' }}-${{ hashFiles('pnpm-lock.yaml', '**/turbo.json') }}-${{ github.sha }}
          restore-keys: turbo-test-${{ join(matrix.packages, '-') }}${{ matrix.shard && format('-shard-{0}', matrix.shard.index) || '' }}-${{ hashFiles('pnpm-lock.yaml', '**/turbo.json') }}-
      - run: |
          pnpm install --frozen-lockfile
          node scripts/cache-platform.ts
      - name: Wait until PostgreSQL and the object store answer on their ports
        if: matrix.services
        run: |
          for _ in $(seq 1 30); do
            docker exec postgresql pg_isready --host 127.0.0.1 --username postgres && break
            sleep 1
          done
          docker exec postgresql pg_isready --host 127.0.0.1 --username postgres
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9000/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9000/health
      - name: Run the tests of the group's packages two at a time, each with 100% coverage per file, or the shard's tests into a blob report the coverage job merges and checks, from no cache outside a pull request
        run: |
          node scripts/cache-platform.ts
          filters=()
          for name in $PACKAGES; do
            filters+=("--filter=@on.auto/$name")
          done
          if [ "$UNCACHED" = true ]; then
            filters+=(--force)
          fi
          pnpm exec turbo run "$TASK" --concurrency=2 "${filters[@]}"
        env:
          PACKAGES: ${{ join(matrix.packages, ' ') }}
          TASK: ${{ matrix.shard && 'test:shard' || 'test' }}
          VITEST_SHARD: ${{ matrix.shard && format('{0}/{1}', matrix.shard.index, matrix.shard.count) || '' }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_RUN_SUMMARY: true
          LEDGER_TEST_POSTGRESQL_URL: ${{ matrix.services && 'postgresql://postgres:ledger-ci@127.0.0.1:5432/postgres' || '' }}
          CONTENT_TEST_OBJECT_STORE_URL: ${{ matrix.services && 'http://content-ci:content-ci-secret@127.0.0.1:9000/content-ci' || '' }}
      - name: Upload the shard's blob report, with its coverage, for the coverage job
        if: matrix.shard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-blob-report-${{ matrix.shard.index }}
          path: packages/server/.vitest/blob/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Show the inputs of turbo's global hash and, for each task, its hash, its cache status and its time
        if: ${{ !cancelled() }}
        run: .github/turbo/show-run-summary.sh
      - name: Keep in turbo's cache only the tasks of this run, so the cache it saves holds one run and does not grow
        if: ${{ !cancelled() && steps.turbo-cache.outputs.cache-hit != 'true' }}
        run: .github/turbo/keep-only-this-run.sh
      - name: Save turbo's cache for the next run of this group
        if: ${{ !cancelled() && steps.turbo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}
      - name: Show the logs of PostgreSQL and the object store when the tests failed
        if: failure() && matrix.services
        run: |
          docker logs postgresql
          docker logs object-store

  coverage:
    name: Coverage (server)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: |
          pnpm install --frozen-lockfile
          node scripts/cache-platform.ts
      - name: Download the blob reports of the server's shards into the server package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages/server/.vitest/blob
          pattern: server-blob-report-*
          merge-multiple: true
      - name: Merge the shards' reports and check 100% coverage per file over the server's whole suite
        run: pnpm --filter @on.auto/server test:merge

  container:
    name: Container (linux/${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: onauto/runtime:ci
      - name: Smoke test the image
        run: .github/smoke/image.sh 5555 onauto/runtime:ci
      - name: Start the image with telemetry sent to a collector that is not there
        run: .github/smoke/telemetry.sh 5556 onauto/runtime:ci
      - name: Measure the image
        timeout-minutes: 2
        run: .github/smoke/measure.sh onauto/runtime:ci ${{ matrix.architecture }}
      - name: Keep a playbook on a volume across a restart
        run: .github/smoke/volume-restart.sh 5555 onauto/runtime:ci
      - name: Keep a playbook in PostgreSQL across a restart
        timeout-minutes: 2
        run: .github/smoke/postgresql-restart.sh 5555 onauto/runtime:ci
      - name: Serve the tools over MCP
        run: .github/smoke/mcp.sh 5555 onauto/runtime:ci
      - name: Run a reasoning function without model settings
        run: .github/smoke/reasoning.sh 5555 onauto/runtime:ci
      - name: Run a computation function
        run: .github/smoke/computation.sh 5555 onauto/runtime:ci
      - name: Ask an agent and answer over HTTP
        timeout-minutes: 2
        run: .github/smoke/interaction.sh 5555 onauto/runtime:ci
      - name: Save a prediction function, publish its events and ask it a question
        timeout-minutes: 5
        run: .github/smoke/prediction.sh 5555 onauto/runtime:ci
      - name: Run workflows across a restart, and read the steps of a run and their causes
        timeout-minutes: 5
        run: .github/smoke/workflows.sh 5555 onauto/runtime:ci
      - name: Read the analytics of a playbook
        timeout-minutes: 2
        run: .github/smoke/analytics.sh 5555 onauto/runtime:ci

      - name: Start a workflow by its event trigger and by its schedule
        timeout-minutes: 5
        run: .github/smoke/triggers.sh 5555 onauto/runtime:ci

  package:
    name: npm package (linux/${{ matrix.architecture }}, ${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
        system:
          - ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8
          - ubuntu:22.04@sha256:9abcaffc92a5279fff3a6a41635c0800ea33e528425fb389658806476e7defde
          - almalinux:8.10@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
          - node:26.13.1-alpine3.24@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
        include:
          - system: almalinux:8.10@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
            node: 26.10.0
          - architecture: arm64
            system: node:26.13.1-alpine3.24@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: |
          pnpm install --frozen-lockfile
          node scripts/cache-platform.ts
      - run: pnpm --filter @on.auto/server npm:pack
      - name: Set up the version of Node the row names, which the container is given in place of the one the package was packed with
        if: matrix.node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Run the packed runtime with npx, outside the repository, inside a container of the system the row names
        timeout-minutes: 10
        run: .github/smoke/npm-package-in-container.sh "$GITHUB_WORKSPACE" 5555 "$SYSTEM"
        env:
          SYSTEM: ${{ matrix.system }}

  pull-request-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: |
          pnpm install --frozen-lockfile
          node scripts/cache-platform.ts
      - name: The squash commit title must be a conventional commit
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint
        env:
          TITLE: ${{ github.event.pull_request.title }}

  workflows:
    name: Workflow security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  ci-ok:
    name: ci-ok
    if: always()
    needs: [verify, test, coverage, container, package, pull-request-title, workflows]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Every required job succeeded or was skipped
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}

  alert:
    name: Alert on main
    needs: ci-ok
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or add to the issue that says CI fails on main, and post to the alert webhook, or close that issue once CI passes again
        run: .github/alert/main.sh
        env:
          OUTCOME: ${{ needs.ci-ok.result }}
          WORKFLOW: CI
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEES: ${{ vars.CI_ALERT_ASSIGNEES }}
          ALERT_WEBHOOK_URL: ${{ secrets.CI_ALERT_WEBHOOK_URL }}
