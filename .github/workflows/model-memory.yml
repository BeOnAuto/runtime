name: Model process memory

on:
  workflow_dispatch:

permissions: {}

jobs:
  measure:
    name: Model process memory (linux/${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: onauto/runtime:ci
      - name: Measure the least data under which a model process loads a 64 MiB model and walks the widest rows
        timeout-minutes: 20
        run: |
          docker run --rm --entrypoint sh \
            --volume "$PWD/capabilities/prediction/measure:/app/capabilities/prediction/measure:ro" \
            --volume "$PWD/packages/prediction-onnx/measure:/app/packages/prediction-onnx/measure:ro" \
            --volume "$PWD/packages/prediction-onnx/candidates:/app/packages/prediction-onnx/candidates:ro" \
            onauto/runtime:ci -c '
              node packages/prediction-onnx/measure/large-model.ts /tmp/large.onnx
              node capabilities/prediction/measure/large-rows.ts /tmp/rows.csv
              loads() {
                prlimit --core=0 --data=$(($1 * 1048576)) node capabilities/prediction/measure/session-memory.ts \
                  packages/prediction-onnx/src/sessions/model-sessions.ts /tmp/large.onnx /tmp/rows.csv \
                  > /tmp/memory.json 2> /dev/null
              }
              loads 1280 || exit 1
              cat /tmp/memory.json
              low=0
              high=1280
              while [ $((high - low)) -gt 8 ]; do
                middle=$(((low + high) / 2))
                if loads "$middle"; then high=$middle; else low=$middle; fi
              done
              echo "$high"' > session.txt
          resident="$(head --lines 1 session.txt | jq --raw-output '[.before, .after, .peak] | map(. / 1048576 | floor | tostring) | join(", ")')"
          least="$(tail --lines 1 session.txt)"
          test "$least" -gt 0
          {
            echo "### A 64 MiB model walking the widest rows on linux/${{ matrix.architecture }}"
            echo "| What | MiB |"
            echo "| --- | --- |"
            echo "| Resident before the session, after it walked, at the peak, under 1280 MiB of data | $resident |"
            echo "| The least data under which it loads and runs, within 8 MiB | $least |"
          } >> "$GITHUB_STEP_SUMMARY"
